<title>The Old Bakehouse</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Silkscreen&display=swap">
<style>
/* Layout: one game window framed like a carved wooden cabinet, with a chatbox and controls below it. */
:root {
  --ground: #17110c;      /* soot-dark page */
  --wood: #3b2618;        /* panel frame */
  --wood-hi: #5a3a22;     /* frame bevel */
  --parchment: #e9d9b4;   /* main text */
  --muted: #a8916a;       /* secondary text */
  --gold: #f2c14e;        /* accent: headings, active state */
  --say: #ffef3a;         /* overhead / chat speech */
  --font-display: "Pixelify Sans", "Silkscreen", ui-monospace, monospace;
  --font-pixel: "Silkscreen", "Pixelify Sans", ui-monospace, monospace;
  color-scheme: dark;
}
body {
  background: var(--ground);
  color: var(--parchment);
  font-family: var(--font-display);
  font-size: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 32px;
}
.wrap { max-width: 1040px; margin: 0 auto; display: grid; gap: 14px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; }
h1 { margin: 0; font-weight: 700; font-size: clamp(1.6rem, 4vw, 2.3rem); color: var(--gold); letter-spacing: 0.02em; text-wrap: balance; text-shadow: 2px 2px 0 #000; }
.where { margin: 0; color: var(--muted); font-size: 0.95rem; }
.frame {
  background: #0b0705;
  border: 3px solid #000;
  box-shadow: inset 0 0 0 3px var(--wood-hi), inset 0 0 0 6px #000;
  padding: 12px;
  display: grid; place-items: center;
  overflow: hidden;
}
canvas#scene {
  display: block; image-rendering: pixelated; image-rendering: crisp-edges;
  width: 100%; max-width: 100%; aspect-ratio: 1 / 1; height: auto;
  cursor: crosshair; touch-action: manipulation; background: #0b0705;
}
canvas#scene:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.below { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: stretch; }
@media (max-width: 640px) { .below { grid-template-columns: minmax(0, 1fr); } }
.chat {
  background: #0d0906; border: 3px solid #000; box-shadow: inset 0 0 0 2px var(--wood-hi);
  padding: 10px 12px; min-width: 0; font-family: var(--font-pixel); font-size: 0.78rem; line-height: 1.55; min-height: 7.6em;
}
.chat .tab { color: var(--muted); font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 4px; }
.chat ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
.chat li { color: var(--parchment); overflow-wrap: anywhere; }
.chat li b { color: var(--gold); font-weight: 400; }
.chat li span.say { color: var(--say); }
.chat li.sys { color: var(--muted); }
.side { display: grid; gap: 10px; align-content: start; min-width: 220px; }
@media (max-width: 640px) { .side { min-width: 0; } }
.status { margin: 0; font-size: 1rem; }
.status b { color: var(--gold); font-weight: 600; }
button {
  font: 600 1rem var(--font-display); color: var(--parchment); background: var(--wood);
  border: 3px solid #000; box-shadow: inset 0 0 0 2px var(--wood-hi); padding: 8px 14px; cursor: pointer; text-align: left;
}
button:hover { background: var(--wood-hi); }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
button[aria-pressed="true"] { color: var(--gold); }
.hint { margin: 0; color: var(--muted); font-size: 0.9rem; line-height: 1.4; }
kbd { font-family: var(--font-pixel); font-size: 0.75rem; color: var(--parchment); background: #000; padding: 1px 5px; }
.credit { margin: 0; color: var(--muted); font-size: 0.8rem; }
</style>

<div class="wrap">
  <header>
    <h1>The Old Bakehouse</h1>
    <p class="where">Castle ground floor &middot; the bakery</p>
  </header>

  <div class="frame" id="frame"><canvas id="scene" width="256" height="256" tabindex="0" aria-label="Pixel-art castle bakery where the baker Halvard walks between the oven, flour sacks, worktable, bread rack, water bucket and barrels. Click or tap the floor to send him somewhere."></canvas></div>

  <div class="below">
    <section class="chat" aria-live="polite">
      <div class="tab">Kitchen chat</div>
      <ol id="log"></ol>
    </section>
    <div class="side">
      <p class="status">Halvard is <b id="doing">warming up</b></p>
      <button id="wander" type="button" aria-pressed="true">Wandering: on</button>
      <p class="hint">Click or tap the floor to send him there. <kbd>WASD</kbd> or arrow keys walk him yourself.</p>
      <p class="credit">Room and sprites made with PixelLab. Character design after a pixel daily by @Gerickos.</p>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
const W = 256, H = 256;
const FOOT_Y = __FOOT_Y__;
const ROOM = __ROOM__;   // { floor, pieces:[{img,x,y,foot,shadow:{img,x,y}}] } generated by build.py
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const cv = document.getElementById('scene');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const load = (src) => { const i = new Image(); i.src = src; return i; };
const R = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(x | 0, y | 0, w | 0, h | 0); };

const floor = load(ROOM.floor);
const pieces = ROOM.pieces.map(p => ({ ...p, im: load(p.img), sh: p.shadow ? { ...p.shadow, im: load(p.shadow.img) } : null }));
const atlas = load('__ATLAS__');

// ---------- where the baker's feet may go (room pixels) ----------
const HALF = 10;                                   // half the width of his feet
const ROOMS = [[16, 48, 240, 240]];                // the floor inside the walls
const BLOCK = [
  [16, 48, 56, 80],    // flour sacks
  [80, 48, 129, 78],   // oven
  [50, 122, 112, 155], // worktable
  [208, 48, 240, 150], // bread rack
  [210, 152, 240, 177],// ladle + bucket
  [170, 198, 240, 240] // barrels
];
const walkable = (x, y) =>
  ROOMS.some(([x0, y0, x1, y1]) => x - HALF >= x0 && x + HALF <= x1 && y - 4 >= y0 && y <= y1) &&
  !BLOCK.some(([x0, y0, x1, y1]) => x + HALF > x0 && x - HALF < x1 && y + 2 > y0 && y - 4 < y1);

// ---------- pathfinding on an 8px grid (A*, 8 directions, no corner cutting) ----------
const G = 8, GC = W / G, GR = H / G;
const cellOK = (c, r) => c >= 0 && r >= 0 && c < GC && r < GR && walkable(c * G + 4, r * G + 4);
const cellOf = (x, y) => ({ c: Math.floor(x / G), r: Math.floor(y / G) });
function nearestOpen(c, r) {
  if (cellOK(c, r)) return { c, r };
  for (let d = 1; d < 32; d++) for (let dr = -d; dr <= d; dr++) for (let dc = -d; dc <= d; dc++)
    if ((Math.abs(dc) === d || Math.abs(dr) === d) && cellOK(c + dc, r + dr)) return { c: c + dc, r: r + dr };
  return { c: 16, r: 20 };
}
function astar(s, g) {
  const key = (c, r) => r * GC + c, sk = key(s.c, s.r), gk = key(g.c, g.r);
  const open = [{ c: s.c, r: s.r, f: 0, g: 0 }], from = new Map(), gs = new Map([[sk, 0]]);
  const h = (c, r) => { const dx = Math.abs(c - g.c), dy = Math.abs(r - g.r); return Math.max(dx, dy) + 0.414 * Math.min(dx, dy); };
  while (open.length) {
    let bi = 0; for (let i = 1; i < open.length; i++) if (open[i].f < open[bi].f) bi = i;
    const cur = open.splice(bi, 1)[0], ck = key(cur.c, cur.r);
    if (ck === gk) { const out = []; let k = gk; while (k !== sk) { out.unshift({ c: k % GC, r: (k / GC) | 0 }); k = from.get(k); } return out; }
    for (let dc = -1; dc <= 1; dc++) for (let dr = -1; dr <= 1; dr++) {
      if (!dc && !dr) continue;
      const nc = cur.c + dc, nr = cur.r + dr;
      if (!cellOK(nc, nr) || (dc && dr && (!cellOK(cur.c + dc, cur.r) || !cellOK(cur.c, cur.r + dr)))) continue;
      const ng = cur.g + (dc && dr ? 1.414 : 1), k = key(nc, nr);
      if (ng < (gs.get(k) ?? Infinity)) { gs.set(k, ng); from.set(k, ck); open.push({ c: nc, r: nr, g: ng, f: ng + h(nc, nr) }); }
    }
  }
  return null;
}
// drop waypoints that a straight walk can skip, so he moves in smooth lines
function smooth(pts) {
  const clear = (a, b) => { const n = Math.ceil(Math.hypot(b.x - a.x, b.y - a.y) / 3); for (let i = 1; i <= n; i++) if (!walkable(a.x + (b.x - a.x) * i / n, a.y + (b.y - a.y) * i / n)) return false; return true; };
  const out = []; let a = { x: baker.x, y: baker.y }, i = 0;
  while (i < pts.length) { let j = pts.length - 1; while (j > i && !clear(a, pts[j])) j--; out.push(pts[j]); a = pts[j]; i = j + 1; }
  return out;
}
function goTo(x, y) {
  const g = nearestOpen(...Object.values(cellOf(x, y))), s = nearestOpen(...Object.values(cellOf(baker.x, baker.y)));
  const p = astar(s, g); if (!p) return false;
  const pts = p.map(n => ({ x: n.c * G + 4, y: n.r * G + 4 }));
  if (walkable(x, y)) pts.push({ x, y });
  baker.path = smooth(pts);
  return true;
}

// ---------- baker ----------
const baker = { x: 128, y: 226, dir: 4, moving: false, t: 0, path: [], task: null, wait: 1.2, say: null, sayT: 0, speed: 34 };
const STATIONS = [
  { x: 104, y: 92,  face: 4, doing: 'tending the oven',          lines: ['Hotter than a dragon’s yawn in there.', 'Another batch of rye, nearly done.', 'Keep the fire fed and the bread behaves.'], oven: true },
  { x: 38,  y: 96,  face: 4, doing: 'checking the flour',        lines: ['Three sacks left. Need the miller.', 'Weevils, stay out of my flour.'] },
  { x: 126, y: 138, face: 6, doing: 'kneading dough',            lines: ['Fold, press, turn. Fold, press, turn.', 'This dough has more fight in it than I do.'], knead: true },
  { x: 82,  y: 172, face: 4, doing: 'rolling out pastry',        lines: ['Thin as a page, that’s the trick.', 'Meat pies for the castle guards.'], knead: true },
  { x: 194, y: 100, face: 2, doing: 'stocking the bread rack',   lines: ['Cool enough to sell.', 'Twelve loaves by noon, then pies.', 'Who keeps nibbling the end of this one?'] },
  { x: 196, y: 166, face: 2, doing: 'drawing water',             lines: ['Fresh from the well this morning.', 'A bucket for the dough, a cup for me.'] },
  { x: 156, y: 222, face: 2, doing: 'checking the barrels',      lines: ['Plenty of salt, short on honey.', 'Who drank the cider? I know it was you, Duke.'] },
  { x: 128, y: 228, face: 0, doing: 'watching the door',         lines: ['Bread! Fresh bread!', 'Come in, come in. Mind the step.', 'Wipe your boots, adventurer.'] },
  { x: 32,  y: 164, face: 6, doing: 'peering down the corridor', lines: ['Kitchen boy’s late again.', 'Smells like the cook burned the stew.'] },
  { x: 160, y: 132, face: 0, doing: 'catching his breath',       lines: ['Forty years of baking. Knees know it.', 'Somebody fetch me an egg.'] },
];

// ---------- UI ----------
const doingEl = document.getElementById('doing'), logEl = document.getElementById('log'), wanderBtn = document.getElementById('wander');
let wandering = true;
function log(html, cls) { const li = document.createElement('li'); if (cls) li.className = cls; li.innerHTML = html; logEl.appendChild(li); while (logEl.children.length > 5) logEl.removeChild(logEl.firstChild); }
function say(text) { baker.say = text; baker.sayT = 3.8; log(`<b>Halvard:</b> <span class="say">${text}</span>`); }
const setDoing = (t) => { doingEl.textContent = t; };
wanderBtn.addEventListener('click', () => {
  wandering = !wandering;
  wanderBtn.setAttribute('aria-pressed', String(wandering));
  wanderBtn.textContent = `Wandering: ${wandering ? 'on' : 'off'}`;
  if (wandering) baker.wait = 0.5; else { baker.task = null; baker.path = []; setDoing('waiting for you'); }
});
log('The castle bakery is open. Halvard has been up since dawn.', 'sys');

function pickTask() {
  const choices = STATIONS.filter(s => s !== baker.task);
  const st = choices[(Math.random() * choices.length) | 0];
  if (goTo(st.x, st.y)) { baker.task = st; setDoing('walking over'); }
  else baker.wait = 1;
}
function arrive() {
  const t = baker.task; if (!t) return;
  if (t.face != null) baker.dir = t.face;
  baker.wait = 3.5 + Math.random() * 4;
  setDoing(t.doing);
  if (t.spot) { manualHold = 4; return; }
  if (t.lines.length && Math.random() < 0.7) say(t.lines[(Math.random() * t.lines.length) | 0]);
}

let marker = null, manualHold = 0;
cv.addEventListener('pointerdown', (e) => {
  const rc = cv.getBoundingClientRect();
  const x = (e.clientX - rc.left) * W / rc.width, y = (e.clientY - rc.top) * H / rc.height;
  if (goTo(x, y)) { baker.task = { spot: true, face: null, doing: 'standing where you sent him', lines: [] }; marker = { x, y, t: 0 }; setDoing('walking where you clicked'); }
});
const keys = new Set();
const KEYMAP = { ArrowUp: 'u', KeyW: 'u', ArrowDown: 'd', KeyS: 'd', ArrowLeft: 'l', KeyA: 'l', ArrowRight: 'r', KeyD: 'r' };
addEventListener('keydown', (e) => { const k = KEYMAP[e.code]; if (!k || e.target.tagName === 'BUTTON') return; keys.add(k); e.preventDefault(); });
addEventListener('keyup', (e) => { const k = KEYMAP[e.code]; if (k) keys.delete(k); });
addEventListener('blur', () => keys.clear());

function dirFrom(dx, dy) {   // atlas order: S, SE, E, NE, N, NW, W, SW
  const oct = (Math.round(Math.atan2(dy, dx) / (Math.PI / 4)) + 8) % 8; // 0=E,1=SE,2=S,...
  return [2, 1, 0, 7, 6, 5, 4, 3][oct];
}

// ---------- effects ----------
const parts = [];
const OVEN_MOUTH = { x: 104, y: 60 };
const TORCHES = [{ x: 64, y: 18 }, { x: 192, y: 18 }];
function puff(x, y, n) { for (let i = 0; i < n; i++) parts.push({ x: x + (Math.random() - .5) * 8, y, vx: (Math.random() - .5) * 8, vy: -6 - Math.random() * 8, life: 1 + Math.random(), max: 2, kind: 'flour' }); }

let kneadT = 0;
function update(dt) {
  baker.t += dt;
  if (baker.sayT > 0) baker.sayT -= dt;
  let kx = (keys.has('r') ? 1 : 0) - (keys.has('l') ? 1 : 0), ky = (keys.has('d') ? 1 : 0) - (keys.has('u') ? 1 : 0);
  if (kx || ky) {
    const len = Math.hypot(kx, ky); kx /= len; ky /= len;
    baker.path = []; baker.task = null; manualHold = 4;
    const nx = baker.x + kx * baker.speed * dt, ny = baker.y + ky * baker.speed * dt;
    if (walkable(nx, baker.y)) baker.x = nx;
    if (walkable(baker.x, ny)) baker.y = ny;
    baker.dir = dirFrom(kx, ky); baker.moving = true; setDoing('walking where you steer him');
  } else if (baker.path.length) {
    const tgt = baker.path[0], dx = tgt.x - baker.x, dy = tgt.y - baker.y, d = Math.hypot(dx, dy), step = baker.speed * dt;
    if (d <= step) { baker.x = tgt.x; baker.y = tgt.y; baker.path.shift(); } else { baker.x += dx / d * step; baker.y += dy / d * step; }
    if (d > 0.5) baker.dir = dirFrom(dx, dy);
    baker.moving = true;
    if (!baker.path.length) arrive();
  } else {
    baker.moving = false;
    if (manualHold > 0) { manualHold -= dt; if (manualHold <= 0 && wandering) baker.wait = 1; }
    else if (wandering) {
      baker.wait -= dt;
      if (baker.task?.knead && !reduceMotion) { kneadT -= dt; if (kneadT <= 0) { kneadT = 0.5 + Math.random() * 0.6; puff(84, 128, 3); } }
      if (baker.wait <= 0) pickTask();
    }
  }
  if (marker) { marker.t += dt; if (marker.t > 0.8) marker = null; }
  if (!reduceMotion && Math.random() < dt * 2.5) parts.push({ x: OVEN_MOUTH.x - 8 + Math.random() * 16, y: OVEN_MOUTH.y + 6, vx: (Math.random() - .5) * 5, vy: -10 - Math.random() * 8, life: 0.8, max: 0.8, kind: 'ember' });
  for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; if (p.kind === 'flour') p.vy += 10 * dt; if (p.life <= 0) parts.splice(i, 1); }
}

// ---------- draw ----------
function drawBaker() {
  if (!atlas.naturalWidth) return;
  let sx, sy;
  if (baker.moving) { sy = (8 + baker.dir) * 80; sx = (Math.floor(baker.t * 9) % 6) * 80; }
  else if (baker.dir === 0) { sy = 16 * 80; sx = 0; }                 // front idle uses the clean static pose
  else { sy = baker.dir * 80; sx = (Math.floor(baker.t * 4) % 4) * 80; }
  ctx.fillStyle = 'rgba(20,8,4,.35)';
  ctx.beginPath(); ctx.ellipse(baker.x, baker.y - 1, 16, 4, 0, 0, Math.PI * 2); ctx.fill();
  ctx.drawImage(atlas, sx, sy, 80, 80, Math.round(baker.x - 40), Math.round(baker.y - FOOT_Y), 80, 80);
}
function wrapText(text, max) {
  const words = text.split(' '), lines = []; let line = '';
  for (const w of words) { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > max && line) { lines.push(line); line = w; } else line = t; }
  if (line) lines.push(line); return lines;
}
function drawSpeech() {
  if (!baker.say || baker.sayT <= 0) return;
  ctx.font = '8px Silkscreen, "Pixelify Sans", monospace'; ctx.textBaseline = 'top';
  const lines = wrapText(baker.say, 150);
  const top = Math.max(2, Math.round(baker.y - FOOT_Y + 4 - lines.length * 9));
  lines.forEach((ln, i) => {
    const tw = Math.ceil(ctx.measureText(ln).width);
    const x = Math.max(3, Math.min(W - tw - 3, Math.round(baker.x - tw / 2))), y = top + i * 9;
    ctx.fillStyle = '#000'; ctx.fillText(ln, x + 1, y + 1);
    ctx.fillStyle = '#ffef3a'; ctx.fillText(ln, x, y);
  });
}
function glow(x, y, r, a, rgb) {
  const g = ctx.createRadialGradient(x, y, 1, x, y, r);
  g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`);
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
}
function draw(time) {
  if (!floor.naturalWidth) return;
  ctx.drawImage(floor, 0, 0);
  for (const p of pieces) if (p.sh && p.sh.im.naturalWidth) ctx.drawImage(p.sh.im, p.sh.x, p.sh.y);
  const list = pieces.map(p => ({ base: p.foot, fn: () => ctx.drawImage(p.im, p.x, p.y) }));
  list.push({ base: baker.y, fn: drawBaker });
  list.sort((a, b) => a.base - b.base).forEach(o => o.fn());

  for (const p of parts) {
    const a = Math.max(0, p.life / p.max);
    if (p.kind === 'ember') R(p.x, p.y, 1, 1, `rgba(255,190,80,${a})`);
    else R(p.x, p.y, 1, 1, `rgba(250,244,230,${a * 0.85})`);
  }

  // firelight from the oven and the two wall torches
  ctx.globalCompositeOperation = 'lighter';
  const f = (k) => reduceMotion ? 1 : 0.85 + Math.sin(time * 9 + k) * 0.08 + Math.sin(time * 3.7 + k * 2) * 0.07;
  glow(OVEN_MOUTH.x, OVEN_MOUTH.y + 8, 70 * f(0), 0.22, '255,130,40');
  TORCHES.forEach((t, i) => glow(t.x, t.y + 6, 46 * f(i + 1), 0.16, '255,170,70'));
  ctx.globalCompositeOperation = 'source-over';

  if (marker) {
    const s = 3 - marker.t * 2.5, a = 1 - marker.t / 0.8;
    ctx.fillStyle = `rgba(255,230,40,${a})`;
    for (let i = -s; i <= s; i++) { ctx.fillRect(marker.x + i | 0, marker.y + i | 0, 1, 1); ctx.fillRect(marker.x + i | 0, marker.y - i | 0, 1, 1); }
  }
  drawSpeech();
}

// scale the room by whole pixels so the art stays crisp, as large as the screen allows
const frameEl = document.getElementById('frame');
function fit() {
  const avail = Math.min(frameEl.clientWidth - 24, Math.max(256, innerHeight * 0.78));
  const s = Math.floor(avail / W);
  cv.style.width = s >= 1 ? (W * s) + 'px' : '100%';
}
addEventListener('resize', fit); fit();

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw(now / 1000);
  requestAnimationFrame(frame);
}
document.fonts?.load('8px Silkscreen').catch(() => {});
requestAnimationFrame(frame);
})();
</script>

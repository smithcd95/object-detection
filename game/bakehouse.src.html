<title>The Old Bakehouse</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Silkscreen&display=swap">
<style>
/* Layout: one game window framed like a carved wooden cabinet, with a chatbox and controls below it. */
:root {
  --ground: #17110c;      /* soot-dark page */
  --wood: #3b2618;        /* panel frame */
  --wood-hi: #5a3a22;     /* frame bevel */
  --parchment: #e9d9b4;   /* main text */
  --muted: #a8916a;       /* secondary text */
  --gold: #f2c14e;        /* accent: headings, active state */
  --say: #ffef3a;         /* overhead / chat speech */
  --font-display: "Pixelify Sans", "Silkscreen", ui-monospace, monospace;
  --font-pixel: "Silkscreen", "Pixelify Sans", ui-monospace, monospace;
  color-scheme: dark;
}
html, body { height: auto; }
body {
  background: var(--ground);
  color: var(--parchment);
  font-family: var(--font-display);
  font-size: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 32px;
}
.wrap { max-width: 1040px; margin: 0 auto; display: grid; gap: 14px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; }
h1 { margin: 0; font-weight: 700; font-size: clamp(1.6rem, 4vw, 2.3rem); color: var(--gold); letter-spacing: 0.02em; text-wrap: balance;
     text-shadow: 2px 2px 0 #000; }
.where { margin: 0; color: var(--muted); font-size: 0.95rem; }
.frame {
  background: var(--wood);
  border: 3px solid #000;
  box-shadow: inset 0 0 0 3px var(--wood-hi), inset 0 0 0 6px #000;
  padding: 9px;
  display: grid; place-items: center;
  overflow: hidden;
}
canvas#scene {
  display: block; image-rendering: pixelated; image-rendering: crisp-edges;
  width: 100%; height: auto; max-width: 100%; aspect-ratio: 512 / 368;
  cursor: crosshair; touch-action: manipulation; background: #000;
}
canvas#scene:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.below { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: stretch; }
@media (max-width: 640px) { .below { grid-template-columns: minmax(0, 1fr); } }
.chat {
  background: #0d0906; border: 3px solid #000; box-shadow: inset 0 0 0 2px var(--wood-hi);
  padding: 10px 12px; min-width: 0; font-family: var(--font-pixel); font-size: 0.78rem; line-height: 1.55;
  min-height: 7.6em;
}
.chat .tab { color: var(--muted); font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 4px; }
.chat ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
.chat li { color: var(--parchment); overflow-wrap: anywhere; }
.chat li b { color: var(--gold); font-weight: 400; }
.chat li span.say { color: var(--say); }
.chat li.sys { color: var(--muted); }
.side { display: grid; gap: 10px; align-content: start; min-width: 220px; }
@media (max-width: 640px) { .side { min-width: 0; } }
.status { margin: 0; font-size: 1rem; }
.status b { color: var(--gold); font-weight: 600; }
button {
  font: 600 1rem var(--font-display); color: var(--parchment); background: var(--wood);
  border: 3px solid #000; box-shadow: inset 0 0 0 2px var(--wood-hi); padding: 8px 14px; cursor: pointer; text-align: left;
}
button:hover { background: var(--wood-hi); }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
button[aria-pressed="true"] { color: var(--gold); }
.hint { margin: 0; color: var(--muted); font-size: 0.9rem; line-height: 1.4; }
kbd { font-family: var(--font-pixel); font-size: 0.75rem; color: var(--parchment); background: #000; padding: 1px 5px; }
.credit { margin: 0; color: var(--muted); font-size: 0.8rem; }
</style>

<div class="wrap">
  <header>
    <h1>The Old Bakehouse</h1>
    <p class="where">Starter village &middot; ground-floor kitchen</p>
  </header>

  <div class="frame"><canvas id="scene" width="512" height="368" tabindex="0" aria-label="Pixel-art bakery kitchen where the baker Halvard walks between the oven, counter, table and stores. Click or tap the floor to send him somewhere."></canvas></div>

  <div class="below">
    <section class="chat" aria-live="polite">
      <div class="tab">Kitchen chat</div>
      <ol id="log"></ol>
    </section>
    <div class="side">
      <p class="status">Halvard is <b id="doing">warming up</b></p>
      <button id="wander" type="button" aria-pressed="true">Wandering: on</button>
      <p class="hint">Click or tap the floor to send him there. <kbd>WASD</kbd> or arrow keys walk him yourself.</p>
      <p class="credit">Character design after a pixel daily by @Gerickos.</p>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
const W = 512, H = 368, T = 32, COLS = 16, ROWS = 11;
const FOOT_Y = __FOOT_Y__;
const DIRS = ['south','south-east','east','north-east','north','north-west','west','south-west'];
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const cv = document.getElementById('scene');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

// ---------- seeded random so the kitchen looks the same every load ----------
let seed = 7;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); g.imageSmoothingEnabled = false; return [c, g]; };
const R = (g, x, y, w, h, c) => { g.fillStyle = c; g.fillRect(x|0, y|0, w|0, h|0); };

// ---------- walkability grid ----------
const walk = Array.from({length: ROWS}, (_, r) => Array.from({length: COLS}, (_, c) => r >= 3 && c >= 1 && c <= 14));
const block = (c0, r0, c1, r1) => { for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) walk[r][c] = false; };
block(1, 3, 4, 3);    // oven
block(9, 3, 13, 3);   // counter
block(14, 3, 14, 5);  // cooling rack
block(6, 6, 8, 7);    // work table
block(1, 8, 2, 10);   // flour sacks
block(13, 8, 14, 10); // barrels
const ok = (c, r) => r >= 0 && r < ROWS && c >= 0 && c < COLS && walk[r][c];

// ---------- static background: walls, window, shelves, floor ----------
const [bg, b] = mk(W, H);
(function paintBackground() {
  // ceiling beam + plaster
  R(b, 0, 0, W, 64, '#c7ad82');
  for (let i = 0; i < 260; i++) R(b, rnd()*W, rnd()*60, 2, 1, rnd() < .5 ? '#bba174' : '#d2bb93');
  R(b, 0, 0, W, 8, '#3a2416'); R(b, 0, 8, W, 2, '#24160d');
  // timber frame
  for (const x of [32, 160, 288, 448]) { R(b, x, 10, 8, 52, '#4a2e1b'); R(b, x, 10, 2, 52, '#5e3c24'); }
  R(b, 0, 56, W, 8, '#4a2e1b'); R(b, 0, 56, W, 2, '#5e3c24');
  // stone wainscot
  R(b, 0, 64, W, 32, '#5f5a54');
  for (let y = 64; y < 96; y += 8) {
    const off = ((y / 8) % 2) * 9;
    for (let x = -off; x < W; x += 18) {
      const s = ['#6e6962','#67625b','#76716a','#5c5751'][(rnd()*4)|0];
      R(b, x + 1, y + 1, 16, 6, s); R(b, x + 1, y + 1, 16, 1, '#837d75');
    }
  }
  R(b, 0, 94, W, 2, '#3b3733');

  // window with a view of fields
  const wx = 196, wy = 14, ww = 60, wh = 40;
  R(b, wx - 4, wy - 4, ww + 8, wh + 10, '#3a2416');
  const sky = b.createLinearGradient(0, wy, 0, wy + wh);
  sky.addColorStop(0, '#79b6e3'); sky.addColorStop(1, '#cfe7f2');
  b.fillStyle = sky; b.fillRect(wx, wy, ww, wh);
  R(b, wx + 40, wy + 6, 8, 8, '#fff3b0'); R(b, wx + 42, wy + 4, 4, 12, '#fff3b0'); R(b, wx + 38, wy + 8, 12, 4, '#fff3b0');
  for (let x = 0; x < ww; x++) { const hy = 26 + Math.round(Math.sin(x / 9) * 3 + Math.sin(x / 4) * 1); R(b, wx + x, wy + hy, 1, wh - hy, x % 7 ? '#6aa34a' : '#5b9440'); }
  R(b, wx, wy + 33, ww, 7, '#4f8a3a');
  R(b, wx + 8, wy + 22, 3, 8, '#5a3a22'); R(b, wx + 5, wy + 16, 9, 7, '#3f7a34');
  R(b, wx + ww/2 - 1, wy, 3, wh, '#3a2416'); R(b, wx, wy + wh/2 - 1, ww, 3, '#3a2416');
  R(b, wx - 6, wy + wh + 4, ww + 12, 4, '#5e3c24'); R(b, wx - 6, wy + wh + 8, ww + 12, 2, '#2b1a0f');

  // hanging pans between window and shelves
  for (const [x, len, r] of [[266, 16, 6], [278, 22, 5]]) {
    R(b, x, 10, 1, len, '#2a2a2e');
    R(b, x - r, 10 + len, r * 2, r * 2 - 2, '#2f2f35'); R(b, x - r + 1, 11 + len, r * 2 - 2, 2, '#55555e');
  }

  // shelves with jars and crocks
  for (const sy of [24, 46]) {
    R(b, 300, sy, 140, 4, '#6b4426'); R(b, 300, sy, 140, 1, '#8a5a35'); R(b, 300, sy + 4, 140, 1, '#2b1a0f');
    let x = 304;
    while (x < 432) {
      const kind = (rnd() * 4) | 0, w = kind === 3 ? 12 : 8;
      const col = ['#b85c3a','#d8c48a','#7a8f5a','#c9c4b8'][kind], h = 8 + ((rnd() * 6) | 0);
      R(b, x, sy - h, w, h, col); R(b, x + 1, sy - h, 2, h, 'rgba(255,255,255,.25)');
      R(b, x, sy - h - 2, w, 2, kind === 3 ? '#8a7a5a' : '#5a3a22');
      x += w + 3 + ((rnd() * 4) | 0);
    }
  }
  // wooden peel leaning on wall near oven
  R(b, 168, 30, 3, 60, '#8a5a35'); R(b, 163, 78, 13, 18, '#a8743f');

  // plank floor
  const tones = ['#8a5a35','#7f5230','#93633c','#7a4c2c'];
  for (let y = 96; y < 352; y += 10) {
    R(b, 0, y, W, 10, tones[(y / 10) % 4 | 0]);
    R(b, 0, y, W, 1, '#a06d43'); R(b, 0, y + 9, W, 1, '#5a3820');
    let x = -((rnd() * 60) | 0);
    while (x < W) { const len = 50 + ((rnd() * 70) | 0); x += len; R(b, x, y + 1, 1, 8, '#5a3820'); if (rnd() < .35) R(b, x - 20 - rnd() * 20, y + 4, 3, 2, '#6a4326'); }
  }
  // back-wall contact shadow
  for (let i = 0; i < 6; i++) R(b, 0, 96 + i, W, 1, `rgba(20,10,5,${0.45 - i * 0.07})`);

  // woven rug under the table
  R(b, 168, 180, 144, 92, '#7d2e24'); R(b, 172, 184, 136, 84, '#a8442f'); R(b, 180, 192, 120, 68, '#7d2e24'); R(b, 184, 196, 112, 60, '#b9573a');
  for (let x = 188; x < 292; x += 8) { R(b, x, 222, 4, 4, '#e2b45a'); }
  for (let x = 170; x < 310; x += 4) { R(b, x, 176, 2, 4, '#c9a05a'); R(b, x, 272, 2, 4, '#c9a05a'); }

  // side walls
  for (const sx of [0, 480]) {
    R(b, sx, 10, 32, 342, '#4e3020');
    for (let y = 16; y < 352; y += 12) R(b, sx + 2, y, 28, 1, '#3d2518');
    R(b, sx === 0 ? 30 : 480, 10, 2, 342, '#24160d');
  }
  // doormat at the front opening
  R(b, 224, 330, 64, 18, '#6d5a30'); for (let x = 226; x < 286; x += 3) R(b, x, 332, 1, 14, '#57471f');
})();

// front wall lip (drawn over everything) with doorway to the lane outside
const [front, f] = mk(W, H);
(function paintFront() {
  R(f, 0, 352, W, 16, '#5f5a54');
  for (let x = 0; x < W; x += 16) { R(f, x + 1, 354, 14, 5, '#6e6962'); R(f, x + 9 - 8, 361, 14, 5, '#67625b'); }
  R(f, 0, 352, W, 2, '#837d75');
  // doorway: lane and grass beyond
  R(f, 224, 352, 64, 16, '#7a6a48'); R(f, 224, 352, 64, 3, '#2b1a0f');
  for (let i = 0; i < 30; i++) R(f, 226 + rnd() * 60, 356 + rnd() * 10, 2, 1, '#8c7b56');
  R(f, 220, 352, 4, 16, '#3a2416'); R(f, 288, 352, 4, 16, '#3a2416');
})();

// ---------- furniture, each with a base line for depth sorting ----------
const props = [];
function prop(x, y, w, h, base, paint) { const [c, g] = mk(w, h); paint(g, w, h); props.push({ x, y, c, base }); }

// brick oven, mouth drawn hollow so the fire can sit behind
const OVEN = { x: 34, y: 0, mouthX: 66, mouthY: 70, mouthW: 56, mouthH: 40 };
prop(OVEN.x, OVEN.y, 128, 128, 128, (g) => {
  R(g, 46, 0, 36, 44, '#7d3822'); // chimney
  for (let y = 0; y < 44; y += 6) for (let x = 46 + ((y / 6) % 2) * 6; x < 82; x += 12) R(g, x, y, 11, 5, '#9c4a2e');
  R(g, 44, 0, 40, 4, '#5a2a1a');
  // dome body
  for (let y = 36; y < 120; y++) {
    const t = Math.max(0, 60 - y) ;
    const inset = Math.round(Math.max(0, 22 - Math.sqrt(Math.max(0, 22 * 22 - t * t * 0.9))));
    const half = 58 - (y < 60 ? (60 - y) * 0.55 : 0);
    R(g, 64 - half, y, half * 2, 1, '#6b2f1c');
  }
  for (let y = 38; y < 118; y += 7) {
    const half = 58 - (y < 60 ? (60 - y) * 0.55 : 0);
    for (let x = 64 - half + ((y / 7) % 2) * 7; x < 64 + half - 4; x += 14) {
      R(g, x + 1, y + 1, 12, 5, ['#9c4a2e','#a85536','#8f4128'][(x + y) % 3]);
      R(g, x + 1, y + 1, 12, 1, '#bf6a44');
    }
  }
  // mouth arch (transparent hole) + stone surround
  g.globalCompositeOperation = 'destination-out';
  g.beginPath(); g.moveTo(OVEN.mouthX - OVEN.x, OVEN.mouthY + OVEN.mouthH);
  g.lineTo(OVEN.mouthX - OVEN.x, OVEN.mouthY + 16);
  g.arc(OVEN.mouthX - OVEN.x + OVEN.mouthW / 2, OVEN.mouthY + 16, OVEN.mouthW / 2, Math.PI, 0);
  g.lineTo(OVEN.mouthX - OVEN.x + OVEN.mouthW, OVEN.mouthY + OVEN.mouthH); g.closePath(); g.fill();
  g.globalCompositeOperation = 'source-over';
  for (let a = Math.PI; a <= Math.PI * 2 + 0.01; a += Math.PI / 7) {
    const cx = OVEN.mouthX - OVEN.x + OVEN.mouthW / 2 + Math.cos(a) * (OVEN.mouthW / 2 + 4);
    const cy = OVEN.mouthY + 16 + Math.sin(a) * (OVEN.mouthW / 2 + 4);
    R(g, cx - 4, cy - 3, 8, 6, '#8d8578'); R(g, cx - 4, cy - 3, 8, 1, '#b0a898');
  }
  // hearth ledge
  R(g, 0, 110, 128, 18, '#77716a'); R(g, 0, 110, 128, 2, '#a59e94'); R(g, 0, 126, 128, 2, '#3b3733');
  for (let x = 4; x < 128; x += 20) R(g, x, 112, 1, 14, '#5f5a54');
  // a loaf cooling on the ledge
  R(g, 8, 104, 18, 8, '#b5763a'); R(g, 10, 102, 14, 3, '#cf9150'); R(g, 12, 105, 2, 2, '#8a5228'); R(g, 18, 105, 2, 2, '#8a5228');
  // log pile
  for (const [lx, ly] of [[100, 100], [110, 100], [105, 94]]) { R(g, lx, ly, 10, 8, '#6b4426'); R(g, lx + 3, ly + 2, 4, 4, '#c19a63'); }
});

// counter along the back wall
prop(288, 76, 160, 54, 128, (g, w) => {
  R(g, 0, 4, w, 14, '#b07a46'); R(g, 0, 4, w, 2, '#c99560'); R(g, 0, 16, w, 2, '#7a4c2c');
  R(g, 2, 18, w - 4, 36, '#6b4426');
  for (let x = 6; x < w - 8; x += 38) { R(g, x, 22, 32, 14, '#5a3820'); R(g, x + 1, 23, 30, 12, '#74492a'); R(g, x + 14, 28, 4, 2, '#c9a05a');
                                         R(g, x, 38, 32, 14, '#5a3820'); R(g, x + 1, 39, 30, 12, '#74492a'); }
  R(g, 2, 52, w - 4, 2, '#2b1a0f');
  // loaves, a board with dough, a bowl
  for (const lx of [6, 24, 42]) { R(g, lx, 0, 16, 9, '#a8662e'); R(g, lx + 2, -1, 12, 4, '#c98544'); R(g, lx + 4, 3, 2, 2, '#7a4520'); R(g, lx + 9, 3, 2, 2, '#7a4520'); }
  R(g, 70, 4, 40, 10, '#d0a26a'); R(g, 78, 2, 18, 8, '#f0e2c4'); R(g, 80, 1, 14, 3, '#fbf3e0');
  R(g, 120, 0, 20, 10, '#5d7a8f'); R(g, 122, 0, 16, 3, '#f4ecd8'); R(g, 120, 8, 20, 2, '#3e5363');
});

// cooling rack against the right wall
prop(448, 112, 32, 82, 192, (g) => {
  R(g, 0, 0, 3, 82, '#4a2e1b'); R(g, 29, 0, 3, 82, '#4a2e1b');
  for (let y = 10; y < 80; y += 18) {
    R(g, 0, y, 32, 3, '#6b4426');
    for (let x = 3; x < 28; x += 9) { R(g, x, y - 6, 8, 6, '#b5763a'); R(g, x + 1, y - 7, 6, 2, '#cf9150'); }
  }
});

// central work table
const TABLE = { x: 190, y: 190, w: 100, h: 66 };
prop(TABLE.x, TABLE.y, TABLE.w, TABLE.h, 256, (g, w) => {
  R(g, 4, 40, 6, 26, '#4a2e1b'); R(g, w - 10, 40, 6, 26, '#4a2e1b');
  R(g, 0, 6, w, 34, '#a8743f');
  for (let y = 8; y < 40; y += 8) R(g, 0, y, w, 1, '#8f6034');
  R(g, 0, 6, w, 2, '#c18a52'); R(g, 0, 40, w, 6, '#6b4426'); R(g, 0, 46, w, 1, '#2b1a0f');
  // flour dusting
  for (let i = 0; i < 70; i++) R(g, 20 + rnd() * 50, 12 + rnd() * 22, 1, 1, rnd() < .5 ? '#f3ead6' : '#e4d6b8');
  // dough, bowl, rolling pin, eggs
  R(g, 36, 16, 26, 12, '#efe0bf'); R(g, 38, 14, 22, 4, '#fbf2dd'); R(g, 40, 26, 18, 2, '#d9c59c');
  R(g, 70, 8, 22, 14, '#8a5a35'); R(g, 72, 8, 18, 4, '#f4ecd8'); R(g, 70, 20, 22, 2, '#5a3820');
  R(g, 10, 30, 22, 4, '#c08a50'); R(g, 6, 31, 4, 2, '#8a5a35'); R(g, 32, 31, 4, 2, '#8a5a35');
  R(g, 12, 12, 5, 6, '#f2ead8'); R(g, 18, 14, 5, 6, '#ece0c6');
});

// flour sacks
prop(34, 246, 64, 76, 322, (g) => {
  const sack = (x, y, w, h) => {
    R(g, x + 2, y + 6, w - 4, h - 6, '#e3d6b6'); R(g, x, y + 12, w, h - 16, '#e3d6b6');
    R(g, x + w / 2 - 4, y, 8, 8, '#d6c7a2'); R(g, x + w / 2 - 6, y + 6, 12, 2, '#8a6a3a');
    R(g, x + 2, y + h - 3, w - 4, 3, '#b8a780'); R(g, x + 3, y + 14, 3, h - 20, '#f2e8d0');
    R(g, x + w / 2 - 1, y + 20, 2, 12, '#b07a46'); R(g, x + w / 2 - 4, y + 23, 3, 2, '#b07a46'); R(g, x + w / 2 + 1, y + 26, 3, 2, '#b07a46');
  };
  sack(2, 4, 30, 44); sack(30, 14, 30, 46); sack(10, 34, 32, 40);
  for (let i = 0; i < 20; i++) R(g, 40 + rnd() * 22, 68 + rnd() * 6, 1, 1, '#efe5cc');
});

// barrels
prop(412, 248, 66, 74, 322, (g) => {
  const barrel = (x, y, water) => {
    R(g, x + 2, y + 4, 26, 40, '#7a4a26'); R(g, x, y + 8, 30, 32, '#7a4a26');
    for (let s = x + 4; s < x + 28; s += 6) R(g, s, y + 4, 1, 40, '#5a3820');
    R(g, x, y + 12, 30, 3, '#3a3a40'); R(g, x, y + 32, 30, 3, '#3a3a40');
    R(g, x + 2, y, 26, 6, water ? '#3d6f8f' : '#8a5a35'); R(g, x + 4, y + 1, 10, 1, water ? '#7fb3d1' : '#a06d43');
  };
  barrel(2, 6, true); barrel(34, 22, false); R(g, 40, 30, 16, 2, '#6b4426');
});

// ---------- sprite atlas ----------
const atlas = new Image();
atlas.src = '__ATLAS__';

// ---------- baker ----------
const tileCenter = (c, r) => ({ x: c * T + 16, y: r * T + 22 });
const baker = { x: tileCenter(7, 9).x, y: tileCenter(7, 9).y, dir: 4, moving: false, t: 0, path: [], task: null, wait: 1.5, say: null, sayT: 0, speed: 44 };

const STATIONS = [
  { id: 'oven',    c: 3,  r: 4, face: 4, doing: 'tending the oven',        lines: ['Hotter than a dragon’s yawn in there.', 'Another batch of rye, nearly done.', 'Keep the fire fed and the bread behaves.'] },
  { id: 'counter', c: 11, r: 4, face: 4, doing: 'shaping loaves',          lines: ['Twelve loaves by noon, then pies.', 'A good crust takes patience.', 'Who keeps nibbling the end of this one?'] },
  { id: 'table',   c: 5,  r: 6, face: 2, doing: 'kneading dough',           lines: ['Fold, press, turn. Fold, press, turn.', 'This dough has more fight in it than I do.', 'Flour everywhere again.'], knead: true },
  { id: 'table2',  c: 7,  r: 8, face: 4, doing: 'rolling out pastry',       lines: ['Thin as a page, that’s the trick.', 'Meat pies for the farmhands.'], knead: true },
  { id: 'window',  c: 7,  r: 4, face: 4, doing: 'looking out the window',   lines: ['Fine day. Cows are out on the hill.', 'Smoke from the mill again.'] },
  { id: 'flour',   c: 3,  r: 8, face: 6, doing: 'checking the flour',       lines: ['Two sacks left. Need the miller.', 'Weevils, stay out of my flour.'] },
  { id: 'barrels', c: 12, r: 9, face: 2, doing: 'drawing water',            lines: ['Fresh from the well this morning.', 'A bucket for the dough, a cup for me.'] },
  { id: 'rack',    c: 13, r: 5, face: 2, doing: 'checking the cooling rack', lines: ['Cool enough to sell.', 'Smells right. Smells like breakfast.'] },
  { id: 'door',    c: 8,  r: 9, face: 0, doing: 'watching the door',        lines: ['Bread! Fresh bread!', 'Come in, come in. Mind the step.', 'Wipe your boots, adventurer.'] },
];

// ---------- pathfinding (A*, 8 directions, no corner cutting) ----------
function astar(sc, sr, gc, gr) {
  const key = (c, r) => r * COLS + c;
  const open = [{ c: sc, r: sr, g: 0, f: 0 }], from = new Map(), gs = new Map([[key(sc, sr), 0]]);
  const h = (c, r) => { const dx = Math.abs(c - gc), dy = Math.abs(r - gr); return Math.max(dx, dy) + 0.414 * Math.min(dx, dy); };
  while (open.length) {
    open.sort((a, b) => a.f - b.f);
    const cur = open.shift();
    if (cur.c === gc && cur.r === gr) {
      const out = []; let k = key(gc, gr);
      while (k !== key(sc, sr)) { out.unshift({ c: k % COLS, r: (k / COLS) | 0 }); k = from.get(k); }
      return out;
    }
    for (let dc = -1; dc <= 1; dc++) for (let dr = -1; dr <= 1; dr++) {
      if (!dc && !dr) continue;
      const nc = cur.c + dc, nr = cur.r + dr;
      if (!ok(nc, nr)) continue;
      if (dc && dr && (!ok(cur.c + dc, cur.r) || !ok(cur.c, cur.r + dr))) continue;
      const ng = cur.g + (dc && dr ? 1.414 : 1), k = key(nc, nr);
      if (ng < (gs.get(k) ?? Infinity)) { gs.set(k, ng); from.set(k, key(cur.c, cur.r)); open.push({ c: nc, r: nr, g: ng, f: ng + h(nc, nr) }); }
    }
  }
  return null;
}
function nearestOpen(c, r) {
  c = Math.max(0, Math.min(COLS - 1, c)); r = Math.max(0, Math.min(ROWS - 1, r));
  if (ok(c, r)) return { c, r };
  for (let d = 1; d < 12; d++) for (let dr = -d; dr <= d; dr++) for (let dc = -d; dc <= d; dc++)
    if ((Math.abs(dc) === d || Math.abs(dr) === d) && ok(c + dc, r + dr)) return { c: c + dc, r: r + dr };
  return { c: 7, r: 9 };
}
const bakerTile = () => nearestOpen(Math.floor(baker.x / T), Math.floor((baker.y - 6) / T));

function goTo(c, r) {
  const s = bakerTile(), g = nearestOpen(c, r);
  const p = astar(s.c, s.r, g.c, g.r);
  if (!p) return false;
  baker.path = p.map(n => tileCenter(n.c, n.r));
  return true;
}

// ---------- UI ----------
const doingEl = document.getElementById('doing');
const logEl = document.getElementById('log');
const wanderBtn = document.getElementById('wander');
let wandering = true;
function log(html, cls) {
  const li = document.createElement('li'); if (cls) li.className = cls; li.innerHTML = html; logEl.appendChild(li);
  while (logEl.children.length > 5) logEl.removeChild(logEl.firstChild);
}
function say(text) { baker.say = text; baker.sayT = 3.6; log(`<b>Halvard:</b> <span class="say">${text}</span>`); }
function setDoing(t) { doingEl.textContent = t; }
wanderBtn.addEventListener('click', () => {
  wandering = !wandering;
  wanderBtn.setAttribute('aria-pressed', String(wandering));
  wanderBtn.textContent = `Wandering: ${wandering ? 'on' : 'off'}`;
  if (wandering) { baker.wait = 0.5; } else { baker.task = null; baker.path = []; setDoing('waiting for you'); }
});
log('Welcome to the bakehouse. Halvard opens at dawn.', 'sys');

function pickTask() {
  const choices = STATIONS.filter(s => s !== baker.task);
  const st = choices[(Math.random() * choices.length) | 0];
  if (goTo(st.c, st.r)) { baker.task = st; setDoing('walking over'); }
}

// click / tap to walk
let marker = null, manualHold = 0;
cv.addEventListener('pointerdown', (e) => {
  const rc = cv.getBoundingClientRect();
  const x = (e.clientX - rc.left) * W / rc.width, y = (e.clientY - rc.top) * H / rc.height;
  const g = nearestOpen(Math.floor(x / T), Math.floor(y / T));
  if (goTo(g.c, g.r)) {
    baker.task = { id: 'spot', face: null, doing: 'standing where you sent him', lines: [] };
    marker = { x, y, t: 0 }; setDoing('walking where you clicked');
  }
});

// keyboard walking
const keys = new Set();
const KEYMAP = { ArrowUp: 'u', KeyW: 'u', ArrowDown: 'd', KeyS: 'd', ArrowLeft: 'l', KeyA: 'l', ArrowRight: 'r', KeyD: 'r' };
addEventListener('keydown', (e) => { const k = KEYMAP[e.code]; if (!k || e.target.tagName === 'BUTTON') return; keys.add(k); e.preventDefault(); });
addEventListener('keyup', (e) => { const k = KEYMAP[e.code]; if (k) keys.delete(k); });
addEventListener('blur', () => keys.clear());
const walkablePx = (x, y) => [-9, 9].every(o => ok(Math.floor((x + o) / T), Math.floor((y - 4) / T)));

// direction index from a movement vector (screen space, y down)
function dirFrom(dx, dy) {
  const oct = (Math.round(Math.atan2(dy, dx) / (Math.PI / 4)) + 8) % 8; // 0=E,1=SE,2=S,3=SW,4=W,5=NW,6=N,7=NE
  return [2, 1, 0, 7, 6, 5, 4, 3][oct];
}

// ---------- particles ----------
const parts = [];
function puff(x, y, n, kind) { for (let i = 0; i < n; i++) parts.push({ x: x + (Math.random() - .5) * 10, y, vx: (Math.random() - .5) * 10, vy: -8 - Math.random() * 10, life: 1 + Math.random(), max: 2, kind }); }
const motes = Array.from({ length: reduceMotion ? 0 : 18 }, () => ({ x: 196 + Math.random() * 80, y: 100 + Math.random() * 140, p: Math.random() * 6 }));

// ---------- update ----------
let smokeT = 0, kneadT = 0;
function update(dt) {
  baker.t += dt;
  if (baker.sayT > 0) baker.sayT -= dt;

  // keyboard overrides everything while held
  let kx = (keys.has('r') ? 1 : 0) - (keys.has('l') ? 1 : 0), ky = (keys.has('d') ? 1 : 0) - (keys.has('u') ? 1 : 0);
  if (kx || ky) {
    const len = Math.hypot(kx, ky); kx /= len; ky /= len;
    baker.path = []; baker.task = null; manualHold = 4;
    const nx = baker.x + kx * baker.speed * dt, ny = baker.y + ky * baker.speed * dt;
    if (walkablePx(nx, baker.y)) baker.x = nx;
    if (walkablePx(baker.x, ny)) baker.y = ny;
    baker.dir = dirFrom(kx, ky); baker.moving = true; setDoing('walking where you steer him');
  } else if (baker.path.length) {
    const tgt = baker.path[0], dx = tgt.x - baker.x, dy = tgt.y - baker.y, d = Math.hypot(dx, dy), step = baker.speed * dt;
    if (d <= step) { baker.x = tgt.x; baker.y = tgt.y; baker.path.shift(); }
    else { baker.x += dx / d * step; baker.y += dy / d * step; }
    if (d > 0.5) baker.dir = dirFrom(dx, dy);
    baker.moving = true;
    if (!baker.path.length) arrive();
  } else {
    baker.moving = false;
    if (manualHold > 0) { manualHold -= dt; if (manualHold <= 0 && wandering) baker.wait = 1; }
    else if (wandering) {
      baker.wait -= dt;
      if (baker.task && baker.task.knead && !reduceMotion) { kneadT -= dt; if (kneadT <= 0) { kneadT = 0.5 + Math.random() * 0.6; puff(TABLE.x + 50, TABLE.y + 16, 3, 'flour'); } }
      if (baker.wait <= 0) pickTask();
    }
  }

  if (marker) { marker.t += dt; if (marker.t > 0.8) marker = null; }

  // chimney smoke + oven embers
  if (!reduceMotion) {
    smokeT -= dt;
    if (smokeT <= 0) { smokeT = 0.35; parts.push({ x: OVEN.x + 64 + (Math.random() - .5) * 8, y: 4, vx: 3 + Math.random() * 4, vy: -6, life: 2.4, max: 2.4, kind: 'smoke' }); }
    if (Math.random() < dt * 3) parts.push({ x: OVEN.mouthX + 10 + Math.random() * 36, y: OVEN.mouthY + 30, vx: (Math.random() - .5) * 6, vy: -14 - Math.random() * 10, life: 0.9, max: 0.9, kind: 'ember' });
  }
  for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; if (p.kind === 'flour') p.vy += 12 * dt; if (p.life <= 0) parts.splice(i, 1); }
  for (const m of motes) { m.p += dt * 0.4; m.y -= dt * 2; m.x += Math.sin(m.p) * dt * 3; if (m.y < 100) { m.y = 240; m.x = 196 + Math.random() * 80; } }
}

function arrive() {
  const t = baker.task;
  if (!t) return;
  if (t.face != null) baker.dir = t.face;
  baker.wait = 3.5 + Math.random() * 4;
  setDoing(t.doing);
  if (t.id === 'spot') { manualHold = 4; return; }
  if (t.lines.length && Math.random() < 0.7) say(t.lines[(Math.random() * t.lines.length) | 0]);
}

// ---------- draw ----------
function drawFire(time) {
  const { mouthX: x, mouthY: y, mouthW: w, mouthH: h } = OVEN;
  R(ctx, x, y, w, h, '#1a0c06');
  const fl = reduceMotion ? 0 : time;
  for (let i = 0; i < w; i += 2) {
    const hgt = 10 + Math.sin(i * 0.5 + fl * 9) * 4 + Math.sin(i * 0.23 + fl * 5.3) * 5;
    R(ctx, x + i, y + h - hgt, 2, hgt, '#d9471b');
    R(ctx, x + i, y + h - hgt * 0.65, 2, hgt * 0.65, '#ff8a24');
    R(ctx, x + i, y + h - hgt * 0.3, 2, hgt * 0.3, '#ffcf4a');
  }
  R(ctx, x + 6, y + h - 4, w - 12, 4, '#3a1a0c');
  // a loaf on the peel inside
  R(ctx, x + 18, y + h - 20, 20, 7, '#9a5a28'); R(ctx, x + 20, y + h - 22, 16, 3, '#b8743a');
}

function drawBaker() {
  if (!atlas.complete || !atlas.naturalWidth) return;
  let row, frame;
  if (baker.moving) { row = 8 + baker.dir; frame = Math.floor(baker.t * 9) % 6; }
  else if (baker.dir === 0) { row = 16; frame = 0; }           // front idle uses the clean static pose
  else { row = baker.dir; frame = Math.floor(baker.t * 4) % 4; }
  const sx = (row === 16 ? baker.dir : frame) * 80, sy = row * 80;
  // contact shadow
  ctx.fillStyle = 'rgba(25,12,5,.38)';
  ctx.beginPath(); ctx.ellipse(baker.x, baker.y - 1, 18, 5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.drawImage(atlas, sx, sy, 80, 80, Math.round(baker.x - 40), Math.round(baker.y - FOOT_Y), 80, 80);
}

function drawSpeech() {
  if (!baker.say || baker.sayT <= 0) return;
  ctx.font = '8px Silkscreen, "Pixelify Sans", monospace';
  ctx.textBaseline = 'top';
  const tw = Math.ceil(ctx.measureText(baker.say).width);
  let x = Math.round(baker.x - tw / 2); x = Math.max(4, Math.min(W - tw - 4, x));
  const y = Math.max(2, Math.round(baker.y - FOOT_Y - 6));
  ctx.fillStyle = '#000'; ctx.fillText(baker.say, x + 1, y + 1);
  ctx.fillStyle = '#ffef3a'; ctx.fillText(baker.say, x, y);
}

function draw(time) {
  ctx.drawImage(bg, 0, 0);
  drawFire(time);

  // window light on the floor
  ctx.fillStyle = 'rgba(255,240,200,0.07)';
  ctx.beginPath(); ctx.moveTo(196, 96); ctx.lineTo(256, 96); ctx.lineTo(300, 250); ctx.lineTo(214, 250); ctx.closePath(); ctx.fill();
  for (const m of motes) R(ctx, m.x, m.y, 1, 1, 'rgba(255,245,215,.55)');

  // depth-sorted props and baker
  const list = props.map(p => ({ base: p.base, fn: () => ctx.drawImage(p.c, p.x, p.y) }));
  list.push({ base: baker.y, fn: drawBaker });
  list.sort((a, b) => a.base - b.base).forEach(o => o.fn());

  // particles
  for (const p of parts) {
    const a = Math.max(0, p.life / p.max);
    if (p.kind === 'smoke') { const s = 4 + (1 - a) * 8; ctx.fillStyle = `rgba(150,140,130,${a * 0.5})`; ctx.fillRect(p.x - s / 2 | 0, p.y | 0, s | 0, s | 0); }
    else if (p.kind === 'ember') R(ctx, p.x, p.y, 1, 1, `rgba(255,190,80,${a})`);
    else R(ctx, p.x, p.y, 2, 2, `rgba(250,244,230,${a * 0.8})`);
  }

  // oven glow
  const flick = reduceMotion ? 1 : 0.85 + Math.sin(time * 11) * 0.06 + Math.sin(time * 4.7) * 0.06;
  ctx.globalCompositeOperation = 'lighter';
  const gl = ctx.createRadialGradient(OVEN.mouthX + 28, OVEN.mouthY + 30, 4, OVEN.mouthX + 28, OVEN.mouthY + 40, 120 * flick);
  gl.addColorStop(0, 'rgba(255,140,40,0.32)'); gl.addColorStop(1, 'rgba(255,120,30,0)');
  ctx.fillStyle = gl; ctx.fillRect(0, 0, 260, 260);
  ctx.globalCompositeOperation = 'source-over';

  ctx.drawImage(front, 0, 0);

  // click marker
  if (marker) {
    const s = 4 - marker.t * 3, a = 1 - marker.t / 0.8;
    ctx.fillStyle = `rgba(255,230,40,${a})`;
    for (let i = -s; i <= s; i++) { ctx.fillRect(marker.x + i | 0, marker.y + i | 0, 2, 2); ctx.fillRect(marker.x + i | 0, marker.y - i | 0, 2, 2); }
  }

  drawSpeech();

  // soft vignette
  const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.85);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(10,4,0,0.45)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw(now / 1000);
  requestAnimationFrame(frame);
}
document.fonts?.load('8px Silkscreen').catch(() => {});
requestAnimationFrame(frame);
})();
</script>

<style>
/* Layout: the game fills the whole screen; a title card fades out and two small buttons float in the top-right corner. */
:root {
  --ground: #05070b;     /* behind the canvas */
  --panel: rgba(12,16,26,.72);
  --edge: #2d3850;
  --text: #d9dcea;
  --muted: #8790ab;
  --amber: #f0b45c;      /* lamplight accent */
  --font-display: "Pixelify Sans", ui-monospace, monospace;
  color-scheme: dark;
}
html, body { height: 100%; overflow: hidden; }
body { background: var(--ground); color: var(--text); font-family: var(--font-display); overscroll-behavior: none; }
canvas#scene {
  position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block;
  image-rendering: pixelated; image-rendering: crisp-edges; cursor: crosshair; touch-action: none; background: var(--ground);
}
canvas#scene:focus-visible { outline: none; }
.title {
  position: fixed; left: calc(14px + env(safe-area-inset-left, 0px)); top: calc(12px + env(safe-area-inset-top, 0px));
  margin: 0; font-size: clamp(1.3rem, 5vw, 2rem); font-weight: 700; color: var(--amber); text-shadow: 2px 2px 0 #000;
  pointer-events: none; transition: opacity 1.2s ease 2.5s;
}
.title small { display: block; font-size: 0.5em; font-weight: 400; color: var(--text); opacity: .8; }
.title.gone { opacity: 0; }
.tools {
  position: fixed; right: calc(10px + env(safe-area-inset-right, 0px)); top: calc(10px + env(safe-area-inset-top, 0px));
  display: flex; gap: 6px;
}
.tools button {
  font: 600 0.85rem var(--font-display); color: var(--text); background: var(--panel);
  border: 2px solid #000; box-shadow: inset 0 0 0 1px var(--edge); padding: 6px 10px; cursor: pointer;
}
.tools button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.tools button[aria-pressed="false"] { color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .title { transition: none; } }
</style>

  while (i < pts.length) { let j = pts.length - 1; while (j > i && !clear(a, pts[j])) j--; out.push(pts[j]); a = pts[j]; i = j + 1; }
  return out;
}

// ---------- baker ----------
const baker = { x: 150, y: 200, dir: 0, moving: false, t: 0, path: [], speed: 46 };
function goTo(x, y) {
  const g = nearestOpen(Math.floor(x / G), Math.floor(y / G)), s = nearestOpen(Math.floor(baker.x / G), Math.floor(baker.y / G));
  if (!g || !s) return false;
  const p = astar(s, g); if (!p) return false;
  const pts = p.map(n => ({ x: n.c * G + 2, y: n.r * G + 2 }));
  if (walkable(x, y)) pts.push({ x, y });
  baker.path = smooth(pts, baker.x, baker.y);
  return true;
}
const dirFrom = (dx, dy) => [2, 1, 0, 7, 6, 5, 4, 3][(Math.round(Math.atan2(dy, dx) / (Math.PI / 4)) + 8) % 8];

// ---------- camera ----------
const cam = { x: 0, y: 0 };
function updateCam(dt, snap) {
  const tx = Math.max(0, Math.min(WW - VW, baker.x - VW / 2)), ty = Math.max(0, Math.min(WH - VH, baker.y - 30 - VH / 2));
  const k = snap ? 1 : 1 - Math.pow(0.002, dt);
  cam.x += (tx - cam.x) * k; cam.y += (ty - cam.y) * k;
}

// ---------- input ----------
let marker = null;
cv.addEventListener('pointerdown', (e) => {
  const rc = cv.getBoundingClientRect();
  const x = (e.clientX - rc.left) * VW / rc.width + Math.round(cam.x), y = (e.clientY - rc.top) * VH / rc.height + Math.round(cam.y);
  const ok = goTo(x, y); marker = { x, y, t: 0, ok };
});
const keys = new Set(), KEYMAP = { ArrowUp: 'u', KeyW: 'u', ArrowDown: 'd', KeyS: 'd', ArrowLeft: 'l', KeyA: 'l', ArrowRight: 'r', KeyD: 'r' };
addEventListener('keydown', (e) => { const k = KEYMAP[e.code]; if (!k || e.target.tagName === 'BUTTON') return; keys.add(k); e.preventDefault(); });
addEventListener('keyup', (e) => { const k = KEYMAP[e.code]; if (k) keys.delete(k); });
addEventListener('blur', () => keys.clear());
let fxOn = !reduceMotion, showPaths = false;
const fxBtn = document.getElementById('fx'), pathBtn = document.getElementById('paths');
const setBtn = (b, on, a, z) => { b.setAttribute('aria-pressed', String(on)); b.textContent = on ? a : z; };
setBtn(fxBtn, fxOn, 'Mist: on', 'Mist: off');
fxBtn.addEventListener('click', () => { fxOn = !fxOn; setBtn(fxBtn, fxOn, 'Mist: on', 'Mist: off'); });
pathBtn.addEventListener('click', () => { showPaths = !showPaths; setBtn(pathBtn, showPaths, 'Paths: on', 'Paths'); });
// fit the camera to the screen: the shorter side shows about 300 world pixels, never more than the map
function fitView() {
  const w = cv.clientWidth || innerWidth, h = cv.clientHeight || innerHeight;
  let k = Math.min(w, h) / 300;
  let vw = w / k, vh = h / k;
  const over = Math.max(vw / WW, vh / WH, 1); vw /= over; vh /= over;
  VW = Math.round(vw); VH = Math.round(vh);
  cv.width = VW; cv.height = VH; ctx.imageSmoothingEnabled = false;
  updateCam(0, true);
}
addEventListener('resize', fitView);
setTimeout(() => document.getElementById('title').classList.add('gone'), 50);

// ---------- atmosphere ----------
// light sources: x, y, radius, colour, flicker strength
const LIGHTS = [
  [120, 101, 34, '255,170,80', 1], [145, 103, 34, '255,170,80', 1],     // plaza lanterns
  [186, 45, 26, '255,190,100', .5], [180, 112, 30, '255,180,90', .6],   // lighthouse windows / door
  [372, 352, 70, '255,165,70', 1],                                       // lower lamppost
  [328, 206, 22, '255,180,90', .5], [381, 140, 20, '255,180,90', .5], [298, 116, 18, '255,180,90', .5],
  [455, 70, 24, '255,170,80', 1], [486, 88, 24, '255,170,80', 1],       // hanging lanterns
  [474, 300, 20, '255,180,90', .5], [506, 378, 22, '255,180,90', .5],
];
// sea mask: deep-blue pixels on the open water side, found once from the painting
let seaPts = [];
function buildSea() {
  const [c, g] = (() => { const c = document.createElement('canvas'); c.width = WW; c.height = WH; return [c, c.getContext('2d', { willReadFrequently: true })]; })();
  g.drawImage(plate, 0, 0); const d = g.getImageData(0, 0, WW, WH).data;
  for (let y = 0; y < WH; y += 2) for (let x = 0; x < 200; x += 2) {
    const i = (y * WW + x) * 4, r = d[i], gg = d[i + 1], b = d[i + 2];
    if (b > r + 25 && b >= gg && r < 70 && (x < 40 || y < 130) && !walkable(x, y)) seaPts.push(x, y);
  }
}
const sparkles = [];
function spawnSparkle() { if (!seaPts.length) return; const k = (Math.random() * seaPts.length / 2 | 0) * 2; sparkles.push({ x: seaPts[k], y: seaPts[k + 1], life: 0, max: 1.2 + Math.random() * 1.6, len: 2 + (Math.random() * 4 | 0) }); }
// soft mist: a tiling value-noise texture drawn large and drifting
function makeMist(size, seed) {
  const c = document.createElement('canvas'); c.width = c.height = size; const g = c.getContext('2d'); const img = g.createImageData(size, size);
  let s = seed; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const N = 8, grid = Array.from({ length: N * N }, rnd);
  const at = (x, y) => grid[((y % N + N) % N) * N + ((x % N + N) % N)];
  const sm = t => t * t * (3 - 2 * t);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const fx = x / size * N, fy = y / size * N, x0 = Math.floor(fx), y0 = Math.floor(fy), tx = sm(fx - x0), ty = sm(fy - y0);
    const v = (at(x0, y0) * (1 - tx) + at(x0 + 1, y0) * tx) * (1 - ty) + (at(x0, y0 + 1) * (1 - tx) + at(x0 + 1, y0 + 1) * tx) * ty;
    const a = Math.max(0, v - 0.45) * 1.8; const i = (y * size + x) * 4;
    img.data[i] = 150; img.data[i + 1] = 165; img.data[i + 2] = 200; img.data[i + 3] = a * 255;
  }
  g.putImageData(img, 0, 0); return c;
}
const mistA = makeMist(128, 11), mistB = makeMist(128, 97);
const motes = Array.from({ length: 40 }, () => ({ x: Math.random() * 512, y: Math.random() * 512, p: Math.random() * 6, s: 0.5 + Math.random() }));
const embers = [];

// ---------- update / draw ----------
function update(dt, time) {
  baker.t += dt;
  let kx = (keys.has('r') ? 1 : 0) - (keys.has('l') ? 1 : 0), ky = (keys.has('d') ? 1 : 0) - (keys.has('u') ? 1 : 0);
  if (kx || ky) {
    const len = Math.hypot(kx, ky); kx /= len; ky /= len; baker.path = [];
    const nx = baker.x + kx * baker.speed * dt, ny = baker.y + ky * baker.speed * dt;
    if (walkable(nx, baker.y)) baker.x = nx; if (walkable(baker.x, ny)) baker.y = ny;
    baker.dir = dirFrom(kx, ky); baker.moving = true;
  } else if (baker.path.length) {
    const t = baker.path[0], dx = t.x - baker.x, dy = t.y - baker.y, d = Math.hypot(dx, dy), st = baker.speed * dt;
    if (d <= st) { baker.x = t.x; baker.y = t.y; baker.path.shift(); } else { baker.x += dx / d * st; baker.y += dy / d * st; }
    if (d > 0.5) baker.dir = dirFrom(dx, dy); baker.moving = baker.path.length > 0;
  } else baker.moving = false;
  updateCam(dt);
  if (marker) { marker.t += dt; if (marker.t > 0.7) marker = null; }
  if (fxOn) {
    if (Math.random() < dt * 18) spawnSparkle();
    if (Math.random() < dt * 3) { const l = LIGHTS[(Math.random() * LIGHTS.length) | 0]; if (l[4] === 1) embers.push({ x: l[0] + (Math.random() - .5) * 4, y: l[1], vy: -6 - Math.random() * 6, vx: (Math.random() - .5) * 4, life: 1.4, max: 1.4 }); }
  }
  for (let i = sparkles.length - 1; i >= 0; i--) { const s = sparkles[i]; s.life += dt; s.x += dt * 2; if (s.life > s.max) sparkles.splice(i, 1); }
  for (let i = embers.length - 1; i >= 0; i--) { const e = embers[i]; e.x += e.vx * dt; e.y += e.vy * dt; e.life -= dt; if (e.life <= 0) embers.splice(i, 1); }
  for (const m of motes) { m.p += dt * .5; m.x += (6 + Math.sin(m.p) * 3) * dt * m.s; m.y += Math.cos(m.p * .7) * 2 * dt; if (m.x > 512) m.x -= 512; }
}

function drawBaker() {
  if (!atlas.naturalWidth) return;
  let sx, sy;
  if (baker.moving) { sy = (8 + baker.dir) * 80; sx = (Math.floor(baker.t * 9) % 6) * 80; }
  else if (baker.dir === 0) { sy = 16 * 80; sx = 0; }
  else { sy = baker.dir * 80; sx = (Math.floor(baker.t * 4) % 4) * 80; }
  ctx.fillStyle = 'rgba(5,6,14,.45)'; ctx.beginPath(); ctx.ellipse(baker.x, baker.y - 1, 15, 4, 0, 0, Math.PI * 2); ctx.fill();
  ctx.drawImage(atlas, sx, sy, 80, 80, Math.round(baker.x - 40), Math.round(baker.y - FOOT_Y), 80, 80);
}
function glow(x, y, r, a, rgb) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`);
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
}
function draw(time) {
  if (!plate.naturalWidth) return;
  const ox = Math.round(cam.x), oy = Math.round(cam.y);
  ctx.setTransform(1, 0, 0, 1, -ox, -oy);
  ctx.drawImage(plate, 0, 0);

  // sea glints
  if (fxOn) for (const s of sparkles) { const a = Math.sin(Math.PI * s.life / s.max); ctx.fillStyle = `rgba(150,190,235,${a * .55})`; ctx.fillRect(Math.round(s.x), s.y, s.len, 1); }

  drawBaker();

  if (fxOn) {
    // lamplight flicker
    ctx.globalCompositeOperation = 'lighter';
    LIGHTS.forEach(([x, y, r, rgb, f], i) => {
      const fl = 1 - f * (0.12 + 0.1 * Math.sin(time * 7.3 + i * 2.1) + 0.08 * Math.sin(time * 13.1 + i * 5.7) + (Math.random() < .02 ? .25 : 0));
      glow(x, y, r * (0.92 + fl * 0.1), 0.16 * fl, rgb);
    });
    for (const e of embers) { const a = e.life / e.max; ctx.fillStyle = `rgba(255,200,110,${a})`; ctx.fillRect(Math.round(e.x), Math.round(e.y), 1, 1); }
    ctx.globalCompositeOperation = 'source-over';

    // rolling mist: two layers drifting at different speeds, thicker low on the cliff
    ctx.imageSmoothingEnabled = true;
    const layer = (tex, scale, speed, alpha, yo) => {
      const sz = 128 * scale, off = (time * speed) % sz;
      ctx.globalAlpha = alpha;
      for (let y = -sz + yo; y < WH + sz; y += sz) for (let x = -sz - off; x < WW + sz; x += sz) ctx.drawImage(tex, x, y, sz, sz);
      ctx.globalAlpha = 1;
    };
    layer(mistA, 3, 5, 0.16, 20);
    layer(mistB, 2, 9, 0.10, 70);
    ctx.imageSmoothingEnabled = false;
    // drifting dust motes
    for (const m of motes) { const a = 0.25 + 0.25 * Math.sin(m.p * 2); ctx.fillStyle = `rgba(210,220,255,${a})`; ctx.fillRect(Math.round(m.x), Math.round(m.y), 1, 1); }
  }

  if (showPaths) {
    ctx.fillStyle = 'rgba(90,255,140,.22)'; ctx.strokeStyle = 'rgba(90,255,140,.8)';
    for (const p of WALK) { ctx.beginPath(); p.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); ctx.fill(); ctx.stroke(); }
    ctx.fillStyle = 'rgba(255,80,80,.5)'; for (const [a, b, c, d] of BLOCK) ctx.fillRect(a, b, c - a, d - b);
  }
  if (marker) {
    const s = 3 - marker.t * 3, a = 1 - marker.t / 0.7; ctx.fillStyle = marker.ok ? `rgba(255,225,60,${a})` : `rgba(255,70,60,${a})`;
    for (let i = -s; i <= s; i++) { ctx.fillRect(Math.round(marker.x + i), Math.round(marker.y + i), 1, 1); ctx.fillRect(Math.round(marker.x + i), Math.round(marker.y - i), 1, 1); }
  }

  ctx.setTransform(1, 0, 0, 1, 0, 0);
}

let last = performance.now(), started = false;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (plate.naturalWidth && !started) { started = true; buildSea(); fitView(); }
  update(dt, now / 1000); draw(now / 1000);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>

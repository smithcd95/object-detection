<title>Lighthouse Cliffs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: the game fills the screen; a scene title fades out, small buttons float top-right, and a door prompt rises from the bottom. */
:root {
  --ground: #05070b;
  --panel: rgba(12,16,26,.82);
  --edge: #2d3850;
  --text: #d9dcea;
  --muted: #8790ab;
  --amber: #f0b45c;
  --font-display: "Pixelify Sans", ui-monospace, monospace;
  color-scheme: dark;
}
html, body { height: 100%; overflow: hidden; }
body { background: var(--ground); color: var(--text); font-family: var(--font-display); overscroll-behavior: none; }
canvas#scene {
  position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block;
  image-rendering: pixelated; image-rendering: crisp-edges; cursor: crosshair; touch-action: none; background: var(--ground);
}
canvas#scene:focus-visible { outline: none; }
.title {
  position: fixed; left: calc(14px + env(safe-area-inset-left, 0px)); top: calc(12px + env(safe-area-inset-top, 0px));
  margin: 0; font-size: clamp(1.3rem, 5vw, 2rem); font-weight: 700; color: var(--amber); text-shadow: 2px 2px 0 #000; pointer-events: none;
}
.title small { display: block; font-size: 0.5em; font-weight: 400; color: var(--text); opacity: .8; }
.title.fade { opacity: 0; transition: opacity 1.2s ease 2.5s; }
.tools { position: fixed; right: calc(10px + env(safe-area-inset-right, 0px)); top: calc(10px + env(safe-area-inset-top, 0px)); display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; max-width: 60vw; }
button {
  font: 600 0.85rem var(--font-display); color: var(--text); background: var(--panel);
  border: 2px solid #000; box-shadow: inset 0 0 0 1px var(--edge); padding: 6px 10px; cursor: pointer;
}
button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.tools button[aria-pressed="false"] { color: var(--muted); }
.prompt {
  position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--panel); border: 2px solid #000; box-shadow: inset 0 0 0 1px var(--edge), 0 6px 24px rgba(0,0,0,.5);
  padding: 12px 14px; display: grid; gap: 10px; min-width: min(300px, calc(100vw - 32px)); text-align: center;
}
.prompt[hidden] { display: none; }
.prompt p { margin: 0; font-size: 1.1rem; }
.prompt p b { color: var(--amber); font-weight: 600; }
.prompt .row { display: flex; gap: 8px; justify-content: center; }
.prompt .go { color: var(--amber); }
.talk {
  position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  width: min(620px, calc(100vw - 24px)); background: var(--panel); border: 2px solid #000; cursor: pointer; user-select: none;
  box-shadow: inset 0 0 0 1px var(--edge), 0 6px 24px rgba(0,0,0,.5); padding: 12px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: center;
}
.talk[hidden] { display: none; }
.talk.right { grid-template-columns: minmax(0, 1fr) auto; }
.talk.right canvas { order: 2; }
.talk.right .body { text-align: right; }
.talk:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.talk canvas { width: 96px; height: 108px; image-rendering: pixelated; }
.talk .who { margin: 0 0 4px; color: var(--amber); font-weight: 700; font-size: 1rem; }
.talk .line { margin: 0 0 8px; font-size: 1.1rem; line-height: 1.35; min-height: 2.7em; }
.talk .next { margin: 0; color: var(--muted); font-size: 0.85rem; }
@media (prefers-reduced-motion: reduce) { .title.fade { transition: none; } }
</style>

<canvas id="scene" width="456" height="304" tabindex="0" aria-label="Pixel-art game scene. Click or tap the ground to walk the baker there; WASD or arrow keys also walk him."></canvas>
<h1 class="title" id="title">Lighthouse Cliffs<small>Tap a path to walk</small></h1>
<div class="tools">
  <button id="fx" type="button" aria-pressed="true">Effects: on</button>
  <button id="pace" type="button" aria-pressed="true">Pace: calm</button>
  <button id="paths" type="button" aria-pressed="false">Paths</button>
</div>
<div class="talk" id="talk" role="dialog" aria-live="polite" aria-labelledby="talkWho" tabindex="0" hidden>
  <canvas id="talkFace" width="96" height="108" aria-hidden="true"></canvas>
  <div class="body"><p class="who" id="talkWho"></p><p class="line" id="talkLine"></p><p class="next" id="talkNext">Click to continue</p></div>
</div>
<div class="prompt" id="prompt" role="dialog" aria-live="polite" hidden>
  <p id="promptText">Enter the <b>tavern</b>?</p>
  <div class="row"><button id="promptYes" class="go" type="button">Enter</button><button id="promptNo" type="button">Stay</button></div>
</div>

<script>
(() => {
'use strict';
const FOOT_Y = __FOOT_Y__;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const cv = document.getElementById('scene'), ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const load = (s) => { const i = new Image(); i.src = s; return i; };
const atlas = load('__ATLAS__');
// other characters: same 80px cell atlas layout as the baker (idle rows 0-7, walk 8-15, still poses row 16)
const CAST = {
  mechanic: { atlas: load('__MECH_ATLAS__'), footY: __MECH_FOOT_Y__,
              head: { x: 26, y: 0, w: 28, h: 34, mouth: [38, 25, 5, 2], eyes: [[35, 17, 3, 1], [43, 17, 3, 1]], skin: [39, 13] } },
  baker:    { atlas, footY: FOOT_Y, name: 'Halvard',
              head: { x: 24, y: 0, w: 32, h: 36, mouth: [39, 27, 4, 1], eyes: null } },
};

// ---------- scenes ----------
// walk: polygons the baker's feet may stand in; block: rectangles cut out of them; exits: zones that offer a door
const SCENES = {
  village: {
    title: 'Lighthouse Cliffs', hint: 'Tap a path to walk',
    plate: load('__VILLAGE__'), w: 512, h: 512, scale: 1,
    view: { portrait: 300, landscape: 300, letterbox: false },
    spawn: { x: 150, y: 200, dir: 0 },
    walk: [
      [[28,160],[70,132],[112,128],[160,150],[198,160],[226,176],[242,202],[228,232],[192,250],[140,246],[86,226],[44,196]], // lighthouse plaza
      [[188,240],[232,232],[262,244],[302,262],[346,286],[332,306],[292,302],[250,288],[212,272]],                             // middle terrace
      [[232,160],[262,152],[336,232],[326,274],[294,266]],                                                                    // stair up to the houses
      [[88,226],[140,240],[262,446],[254,480],[226,474]],                                                                     // long stairway down
      [[292,294],[346,280],[384,350],[336,366],[306,330]],                                                                    // ramp: terrace down to lower plaza
      [[256,380],[330,346],[392,350],[432,388],[472,420],[504,468],[512,500],[430,512],[300,512],[262,472],[248,440]],          // lower plaza
    ],
    block: [[104,196,130,218], [240,246,266,276]], // bench, barrel
    exits: [{ zone: [228,148,274,186], ask: 'Enter the <b>tavern</b>?', yes: 'Enter', to: 'tavern', at: { x: 420, y: 378, dir: 5 } }],
    lights: [
      [120, 101, 34, '255,170,80', 1], [145, 103, 34, '255,170,80', 1],
      [186, 45, 26, '255,190,100', .5], [180, 112, 30, '255,180,90', .6],
      [372, 352, 70, '255,165,70', 1],
      [328, 206, 22, '255,180,90', .5], [381, 140, 20, '255,180,90', .5], [298, 116, 18, '255,180,90', .5],
      [455, 70, 24, '255,170,80', 1], [486, 88, 24, '255,170,80', 1],
      [474, 300, 20, '255,180,90', .5], [506, 378, 22, '255,180,90', .5],
    ],
    fx: { sea: true, mist: true, embers: 'lamps', emberRate: 3, mote: '210,220,255', motes: 40 },
  },
  tavern: {
    title: 'The Tavern', hint: 'Tap the floor to walk',
    plate: load('__TAVERN__'), w: 560, h: 448, scale: 1,
    view: { portrait: 248, landscape: 262, letterbox: true },   // same framing as the first tavern (360/380 at 145% size)
    spawn: { x: 300, y: 300, dir: 0 },
    walk: [
      [[80,262],[150,238],[205,232],[255,222],[272,236],[415,312],[440,300],[470,318],[470,350],[455,410],[420,420],[345,385],[290,360],[195,392],[80,300]],
    ],
    block: [
      [72,244,100,292],                                                  // firewood
      [100,270,180,312], [112,294,136,326],                              // round table by the fire, green chair
      [194,256,216,298],                                                 // red armchair
      [190,322,266,372],                                                 // front round table and chairs
      [266,238,284,254], [291,251,309,267], [318,265,336,281], [346,281,364,297], // bar stools
      [350,336,432,372],                                                 // table and chair by the entrance
    ],
    npcs: [{ who: 'mechanic', name: 'Rusk, the barkeep', x: 340, y: 236, dir: 1, behind: true, t: 0, talkAt: { x: 313, y: 262 }, talk: 'barkeep' }],   // standing behind the counter
    fronts: [{ img: load('__BAR_FRONT__'), x: 268, y: 190 }],                  // the counter, drawn over anyone behind it
    exits: [{ zone: [402,382,458,414], ask: 'Head back out to the <b>cliffs</b>?', yes: 'Leave', to: 'village', at: { x: 270, y: 194, dir: 1 } }],
    lights: [
      [148, 228, 40, '255,150,50', 1], [160, 252, 110, '255,130,40', .8], [138, 190, 14, '255,190,110', .5], [330, 240, 40, '255,180,90', .4],
    ],
    fx: { sea: false, mist: false, embers: 'fire', emberRate: 9, emberSpread: 14, mote: '255,225,180', motes: 50 },
  },
};

// ---------- dialogue ----------
// each conversation is a list of [speaker, line]; 'npc' is whoever was clicked, 'me' is the baker
const TALKS = {
  barkeep: [
    [['npc', 'Evening. Boots off the bar, and mind the stools.'], ['me', "Brought the morning's bread, Rusk."], ['npc', 'About time. The regulars have been eyeing the pickled eggs.'], ['npc', "Leave it on the end there. I'll put it on your tab."]],
    [['npc', "Lantern on the tower's been flickering again."], ['me', "Keeper says it's the wind."], ['npc', "Keeper says a lot of things. Something's been nesting up there, mark me."]],
    [['me', "How's the leg?"], ['npc', 'Squeaks when it rains, so I always know before the gulls do.'], ['npc', 'Lost the old one to a winch on the docks, twenty winters back. Built this one myself.']],
    [['npc', "Lighthouse stout's fresh tonight. Dark as the cliffs at midnight and twice as bitter."], ['me', 'Pour me half.'], ['npc', "Half's for sailors. You'll have a whole one, or you'll have tea."]],
  ],
};

let S = null, WW = 0, WH = 0, VW = 456, VH = 304;
const G = 4; let GC = 0, GR = 0, okCache = new Uint8Array(0);
function inPoly(x, y, p) { let c = false; for (let i = 0, j = p.length - 1; i < p.length; j = i++) { const [xi, yi] = p[i], [xj, yj] = p[j]; if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c; } return c; }
const walkable = (x, y) => S.walk.some(p => inPoly(x, y, p)) && !S.block.some(([a, b, c, d]) => x > a && x < c && y > b && y < d);
const inRect = (x, y, [a, b, c, d]) => x >= a && x <= c && y >= b && y <= d;

// ---------- A* on a 4px grid ----------
const cellOK = (c, r) => c >= 0 && r >= 0 && c < GC && r < GR && okCache[r * GC + c] === 1;
function nearestOpen(c, r) {
  if (cellOK(c, r)) return { c, r };
  for (let d = 1; d < 40; d++) for (let dr = -d; dr <= d; dr++) for (let dc = -d; dc <= d; dc++)
    if ((Math.abs(dc) === d || Math.abs(dr) === d) && cellOK(c + dc, r + dr)) return { c: c + dc, r: r + dr };
  return null;
}
function astar(s, g) {
  const key = (c, r) => r * GC + c, sk = key(s.c, s.r), gk = key(g.c, g.r);
  const open = [{ c: s.c, r: s.r, g: 0, f: 0 }], from = new Map(), gs = new Map([[sk, 0]]), closed = new Set();
  const h = (c, r) => { const dx = Math.abs(c - g.c), dy = Math.abs(r - g.r); return Math.max(dx, dy) + 0.414 * Math.min(dx, dy); };
  while (open.length) {
    let bi = 0; for (let i = 1; i < open.length; i++) if (open[i].f < open[bi].f) bi = i;
    const cur = open.splice(bi, 1)[0], ck = key(cur.c, cur.r);
    if (closed.has(ck)) continue; closed.add(ck);
    if (ck === gk) { const out = []; let k = gk; while (k !== sk) { out.unshift({ c: k % GC, r: (k / GC) | 0 }); k = from.get(k); } return out; }
    for (let dc = -1; dc <= 1; dc++) for (let dr = -1; dr <= 1; dr++) {
      if (!dc && !dr) continue;
      const nc = cur.c + dc, nr = cur.r + dr;
      if (!cellOK(nc, nr) || (dc && dr && (!cellOK(cur.c + dc, cur.r) || !cellOK(cur.c, cur.r + dr)))) continue;
      const ng = cur.g + (dc && dr ? 1.414 : 1), k = key(nc, nr);
      if (ng < (gs.get(k) ?? Infinity)) { gs.set(k, ng); from.set(k, ck); open.push({ c: nc, r: nr, g: ng, f: ng + h(nc, nr) }); }
    }
  }
  return null;
}
function smooth(pts, sx, sy) {
  const clear = (a, b) => { const n = Math.ceil(Math.hypot(b.x - a.x, b.y - a.y) / 2); for (let i = 1; i <= n; i++) if (!walkable(a.x + (b.x - a.x) * i / n, a.y + (b.y - a.y) * i / n)) return false; return true; };
  const out = []; let a = { x: sx, y: sy }, i = 0;
  while (i < pts.length) { let j = pts.length - 1; while (j > i && !clear(a, pts[j])) j--; out.push(pts[j]); a = pts[j]; i = j + 1; }
  return out;
}

// ---------- baker ----------
const baker = { x: 0, y: 0, dir: 0, moving: false, t: 0, path: [], speed: 0 };
// animation pace: "calm" is slow and rhythmic; walking speed follows the step rate so his feet stay planted
// speed in world pixels per second at 100% size: ~60 is about RuneScape's walk (one tile per 0.6s game tick)
const PACES = { calm: { walk: 7, idle: 2.2, speed: 60 }, brisk: { walk: 10, idle: 4, speed: 92 } };
let pace = PACES.calm;
const setSpeed = () => { baker.speed = pace.speed * S.scale; };
function goTo(x, y) {
  const g = nearestOpen(Math.floor(x / G), Math.floor(y / G)), s = nearestOpen(Math.floor(baker.x / G), Math.floor(baker.y / G));
  if (!g || !s) return false;
  const p = astar(s, g); if (!p) return false;
  const pts = p.map(n => ({ x: n.c * G + 2, y: n.r * G + 2 }));
  if (walkable(x, y)) pts.push({ x, y });
  baker.path = smooth(pts, baker.x, baker.y);
  return true;
}
const dirFrom = (dx, dy) => [2, 1, 0, 7, 6, 5, 4, 3][(Math.round(Math.atan2(dy, dx) / (Math.PI / 4)) + 8) % 8];

// ---------- camera ----------
const cam = { x: 0, y: 0 };
function updateCam(dt, snap) {
  const lift = 30 * S.scale;
  const tx = VW >= WW ? (WW - VW) / 2 : Math.max(0, Math.min(WW - VW, baker.x - VW / 2));
  const ty = VH >= WH ? (WH - VH) / 2 : Math.max(0, Math.min(WH - VH, baker.y - lift - VH / 2));
  const k = snap ? 1 : 1 - Math.pow(0.002, dt);
  cam.x += (tx - cam.x) * k; cam.y += (ty - cam.y) * k;
}
function fitView() {
  const w = cv.clientWidth || innerWidth, h = cv.clientHeight || innerHeight;
  const k = w < h ? w / S.view.portrait : h / S.view.landscape;
  let vw = w / k, vh = h / k;
  const over = Math.max(vw / WW, S.view.letterbox ? 1 : vh / WH, 1); vw /= over; vh /= over;
  VW = Math.round(vw); VH = Math.round(vh);
  cv.width = VW; cv.height = VH; ctx.imageSmoothingEnabled = false;
  updateCam(0, true);
}
addEventListener('resize', () => { if (S) fitView(); });

// ---------- UI ----------
const titleEl = document.getElementById('title');
const promptEl = document.getElementById('prompt'), promptText = document.getElementById('promptText');
const yesBtn = document.getElementById('promptYes'), noBtn = document.getElementById('promptNo');
let fxOn = !reduceMotion, showPaths = false;
const fxBtn = document.getElementById('fx'), pathBtn = document.getElementById('paths'), paceBtn = document.getElementById('pace');
const setBtn = (b, on, a, z) => { b.setAttribute('aria-pressed', String(on)); b.textContent = on ? a : z; };
setBtn(fxBtn, fxOn, 'Effects: on', 'Effects: off');
fxBtn.addEventListener('click', () => { fxOn = !fxOn; setBtn(fxBtn, fxOn, 'Effects: on', 'Effects: off'); });
pathBtn.addEventListener('click', () => { showPaths = !showPaths; setBtn(pathBtn, showPaths, 'Paths: on', 'Paths'); });
paceBtn.addEventListener('click', () => { pace = pace === PACES.calm ? PACES.brisk : PACES.calm; setSpeed(); setBtn(paceBtn, pace === PACES.calm, 'Pace: calm', 'Pace: brisk'); });
function showTitle() {
  titleEl.innerHTML = `${S.title}<small>${S.hint}</small>`;
  titleEl.classList.remove('fade'); void titleEl.offsetWidth; titleEl.classList.add('fade');
}

// ---------- doors ----------
let offer = null;        // the exit whose prompt is showing
let armed = true;        // false after "Stay" until he steps out of the zone
let fade = 0, fadeDir = 0, pending = null;
function exitAt(x, y) { return S.exits.find(e => inRect(x, y, e.zone)) || null; }
function openPrompt(e) {
  offer = e; promptText.innerHTML = e.ask; yesBtn.textContent = e.yes; promptEl.hidden = false; yesBtn.focus({ preventScroll: true });
}
function closePrompt() { offer = null; promptEl.hidden = true; }
yesBtn.addEventListener('click', () => { if (!offer) return; pending = offer; closePrompt(); fadeDir = 1; });
noBtn.addEventListener('click', () => { closePrompt(); armed = false; cv.focus({ preventScroll: true }); });
addEventListener('keydown', (e) => { if (!offer) return; if (e.key === 'Enter') { e.preventDefault(); yesBtn.click(); } if (e.key === 'Escape') { e.preventDefault(); noBtn.click(); } });

// ---------- input ----------
let marker = null;
cv.addEventListener('pointerdown', (e) => {
  if (fadeDir) return;
  if (offer) { closePrompt(); armed = false; }
  const rc = cv.getBoundingClientRect();
  const x = (e.clientX - rc.left) * VW / rc.width + Math.round(cam.x), y = (e.clientY - rc.top) * VH / rc.height + Math.round(cam.y);
  if (talking) closeTalk();
  const n = npcAt(x, y);
  if (n) {                              // clicked a character: walk up to them, then talk
    talkTarget = n;
    const spot = n.talkAt || { x: n.x, y: n.y + 20 };
    if (Math.hypot(baker.x - spot.x, baker.y - spot.y) < 6) { baker.path = []; startTalk(n); }
    else goTo(spot.x, spot.y);
    return;
  }
  talkTarget = null;
  const ok = goTo(x, y); marker = { x, y, t: 0, ok };
  // tapping the door zone itself means "I want to go through": re-arm the prompt
  if (exitAt(x, y)) armed = true;
});
// hit test against a character's drawn body
function npcAt(x, y) {
  for (const n of (S.npcs || [])) {
    const c = CAST[n.who]; if (!c || !n.talk) continue;
    const k = S.scale, top = n.y - c.footY * k + 8 * k;
    if (x > n.x - 18 * k && x < n.x + 18 * k && y > top && y < n.y) return n;
  }
  return null;
}
cv.addEventListener('pointermove', (e) => {
  if (!S) return; const rc = cv.getBoundingClientRect();
  const x = (e.clientX - rc.left) * VW / rc.width + Math.round(cam.x), y = (e.clientY - rc.top) * VH / rc.height + Math.round(cam.y);
  cv.style.cursor = npcAt(x, y) ? 'pointer' : 'crosshair';
});
const talkEl = document.getElementById('talk'), talkWho = document.getElementById('talkWho'), talkLine = document.getElementById('talkLine'), talkNext = document.getElementById('talkNext');
const face = document.getElementById('talkFace').getContext('2d');
let talking = null, talkTarget = null;
// talk state: the conversation, which line, how many letters are shown, and a clock for the face
const chat = { lines: [], i: 0, shown: 0, t: 0, blink: 2 };
function startTalk(n) {
  talking = n; talkTarget = null; baker.dir = dirFrom(n.x - baker.x, n.y - baker.y);
  const convos = TALKS[n.talk]; n.convo = ((n.convo ?? -1) + 1) % convos.length;
  chat.lines = convos[n.convo]; chat.i = 0; showLine();
  talkEl.hidden = false; talkEl.focus({ preventScroll: true });
}
function showLine() {
  const [who] = chat.lines[chat.i]; chat.shown = 0; chat.t = 0;
  talkWho.textContent = who === 'me' ? CAST.baker.name : talking.name;
  talkEl.classList.toggle('right', who === 'me');
  talkNext.textContent = chat.i === chat.lines.length - 1 ? 'Click to finish' : 'Click to continue';
}
function advance() {
  const text = chat.lines[chat.i][1];
  if (chat.shown < text.length) { chat.shown = text.length; return; }   // first click finishes the line
  if (++chat.i >= chat.lines.length) { closeTalk(); return; }
  showLine();
}
function closeTalk() { talking = null; talkEl.hidden = true; cv.focus({ preventScroll: true }); }
talkEl.addEventListener('click', advance);
addEventListener('keydown', (e) => {
  if (!talking) return;
  if (e.key === 'Escape') { e.preventDefault(); closeTalk(); }
  else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); advance(); }
});
// skin colour under each character's eyes, read once from the sprite for blinking
const skinOf = (c) => {
  if (c.skinRGB || !c.head.skin || !c.atlas.naturalWidth) return c.skinRGB;
  const t = document.createElement('canvas'); t.width = t.height = 80; const g = t.getContext('2d', { willReadFrequently: true });
  g.drawImage(c.atlas, 0, 16 * 80, 80, 80, 0, 0, 80, 80); const d = g.getImageData(c.head.skin[0], c.head.skin[1], 1, 1).data;
  return (c.skinRGB = `rgb(${d[0]},${d[1]},${d[2]})`);
};
// RuneScape-style chathead: an enlarged close-up that bobs, moves its mouth while the line types out, and blinks
function updateChat(dt) {
  if (!talking) return;
  chat.t += dt; chat.blink -= dt; if (chat.blink < -0.12) chat.blink = 2 + Math.random() * 3;
  const [who, text] = chat.lines[chat.i];
  const typing = chat.shown < text.length;
  if (typing) chat.shown = Math.min(text.length, chat.shown + dt * 40);
  talkLine.textContent = text.slice(0, Math.floor(chat.shown));
  const c = who === 'me' ? CAST.baker : CAST[talking.who], h = c.head;
  const K = 3, bob = Math.round(Math.sin(chat.t * (typing ? 9 : 2.4)) * (typing ? 1 : 0.6));
  const ox = Math.round((96 - h.w * K) / 2), oy = 108 - h.h * K + bob * K;
  face.clearRect(0, 0, 96, 108); face.imageSmoothingEnabled = false;
  if (!c.atlas.naturalWidth) return;
  face.drawImage(c.atlas, h.x, 16 * 80 + h.y, h.w, h.h, ox, oy, h.w * K, h.h * K);
  const px = (x, y, w, hh, col) => { face.fillStyle = col; face.fillRect(ox + (x - h.x) * K, oy + (y - h.y) * K, w * K, hh * K); };
  if (typing && Math.floor(chat.t / 0.11) % 2 === 0) { const [mx, my, mw, mh] = h.mouth; px(mx, my, mw, mh, '#2a1410'); }
  if (h.eyes && chat.blink < 0) { const col = skinOf(c); if (col) for (const [ex, ey, ew, eh] of h.eyes) px(ex, ey, ew, eh, col); }
}
const keys = new Set(), KEYMAP = { ArrowUp: 'u', KeyW: 'u', ArrowDown: 'd', KeyS: 'd', ArrowLeft: 'l', KeyA: 'l', ArrowRight: 'r', KeyD: 'r' };
addEventListener('keydown', (e) => { const k = KEYMAP[e.code]; if (!k || e.target.tagName === 'BUTTON' || offer) return; if (talking) closeTalk(); talkTarget = null; keys.add(k); e.preventDefault(); });
addEventListener('keyup', (e) => { const k = KEYMAP[e.code]; if (k) keys.delete(k); });
addEventListener('blur', () => keys.clear());

// ---------- atmosphere ----------
let seaPts = [];
function buildSea() {
  seaPts = []; if (!S.fx.sea) return;
  const c = document.createElement('canvas'); c.width = WW; c.height = WH; const g = c.getContext('2d', { willReadFrequently: true });
  g.drawImage(S.plate, 0, 0); const d = g.getImageData(0, 0, WW, WH).data;
  for (let y = 0; y < WH; y += 2) for (let x = 0; x < 200; x += 2) {
    const i = (y * WW + x) * 4, r = d[i], gg = d[i + 1], b = d[i + 2];
    if (b > r + 25 && b >= gg && r < 70 && (x < 40 || y < 130) && !walkable(x, y)) seaPts.push(x, y);
  }
}
const sparkles = [], embers = [];
let motes = [];
function spawnSparkle() { if (!seaPts.length) return; const k = (Math.random() * seaPts.length / 2 | 0) * 2; sparkles.push({ x: seaPts[k], y: seaPts[k + 1], life: 0, max: 1.2 + Math.random() * 1.6, len: 2 + (Math.random() * 4 | 0) }); }
function makeMist(size, seed) {
  const c = document.createElement('canvas'); c.width = c.height = size; const g = c.getContext('2d'); const img = g.createImageData(size, size);
  let s = seed; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const N = 8, grid = Array.from({ length: N * N }, rnd);
  const at = (x, y) => grid[((y % N + N) % N) * N + ((x % N + N) % N)];
  const sm = t => t * t * (3 - 2 * t);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const fx = x / size * N, fy = y / size * N, x0 = Math.floor(fx), y0 = Math.floor(fy), tx = sm(fx - x0), ty = sm(fy - y0);
    const v = (at(x0, y0) * (1 - tx) + at(x0 + 1, y0) * tx) * (1 - ty) + (at(x0, y0 + 1) * (1 - tx) + at(x0 + 1, y0 + 1) * tx) * ty;
    const a = Math.max(0, v - 0.45) * 1.8; const i = (y * size + x) * 4;
    img.data[i] = 150; img.data[i + 1] = 165; img.data[i + 2] = 200; img.data[i + 3] = a * 255;
  }
  g.putImageData(img, 0, 0); return c;
}
const mistA = makeMist(128, 11), mistB = makeMist(128, 97);

// ---------- scene switching ----------
function enterScene(name, at) {
  if (talking) closeTalk(); talkTarget = null;
  S = SCENES[name]; WW = S.w; WH = S.h;
  GC = WW / G; GR = WH / G; okCache = new Uint8Array(GC * GR);
  for (let r = 0; r < GR; r++) for (let c = 0; c < GC; c++) okCache[r * GC + c] = walkable(c * G + 2, r * G + 2) ? 1 : 0;
  const p = at || S.spawn; baker.x = p.x; baker.y = p.y; baker.dir = p.dir; baker.path = []; baker.moving = false;
  armed = !exitAt(baker.x, baker.y);
  sparkles.length = 0; embers.length = 0;
  motes = Array.from({ length: S.fx.motes }, () => ({ x: Math.random() * WW, y: Math.random() * WH, p: Math.random() * 6, s: 0.5 + Math.random() }));
  setSpeed(); fitView(); buildSea(); showTitle();
  document.title = S.title;
}

// ---------- update / draw ----------
function update(dt) {
  baker.t += dt;
  if (fadeDir) {
    fade += fadeDir * dt / 0.45;
    if (fade >= 1 && fadeDir > 0) { fade = 1; enterScene(pending.to, pending.at); pending = null; fadeDir = -1; }
    if (fade <= 0 && fadeDir < 0) { fade = 0; fadeDir = 0; }
  }
  let kx = (keys.has('r') ? 1 : 0) - (keys.has('l') ? 1 : 0), ky = (keys.has('d') ? 1 : 0) - (keys.has('u') ? 1 : 0);
  if (fadeDir) kx = ky = 0;
  if (kx || ky) {
    const len = Math.hypot(kx, ky); kx /= len; ky /= len; baker.path = [];
    const nx = baker.x + kx * baker.speed * dt, ny = baker.y + ky * baker.speed * dt;
    if (walkable(nx, baker.y)) baker.x = nx; if (walkable(baker.x, ny)) baker.y = ny;
    baker.dir = dirFrom(kx, ky); baker.moving = true;
  } else if (baker.path.length && !fadeDir) {
    const t = baker.path[0], dx = t.x - baker.x, dy = t.y - baker.y, d = Math.hypot(dx, dy), st = baker.speed * dt;
    if (d <= st) { baker.x = t.x; baker.y = t.y; baker.path.shift(); } else { baker.x += dx / d * st; baker.y += dy / d * st; }
    if (d > 0.5) baker.dir = dirFrom(dx, dy); baker.moving = baker.path.length > 0;
  } else baker.moving = false;

  // door zones: offer the door once he stops inside one; leaving the zone re-arms it
  if (talkTarget && !baker.moving && !baker.path.length) startTalk(talkTarget);
  const ex = exitAt(baker.x, baker.y);
  if (!ex) { armed = true; if (offer) closePrompt(); }
  else if (!baker.moving && armed && !offer && !fadeDir) openPrompt(ex);

  for (const n of (S.npcs || [])) n.t += dt;
  updateChat(dt);
  updateCam(dt);
  if (marker) { marker.t += dt; if (marker.t > 0.7) marker = null; }
  if (fxOn) {
    if (S.fx.sea && Math.random() < dt * 18) spawnSparkle();
    if (Math.random() < dt * S.fx.emberRate) {
      if (S.fx.embers === 'fire') { const l = S.lights[0]; embers.push({ x: l[0] + (Math.random() - .5) * (S.fx.emberSpread || 22), y: l[1], vy: -6 - Math.random() * 6, vx: (Math.random() - .5) * 4, life: 1.4, max: 1.4 }); }
      else { const l = S.lights[(Math.random() * S.lights.length) | 0]; if (l[4] === 1) embers.push({ x: l[0] + (Math.random() - .5) * 4, y: l[1], vy: -6 - Math.random() * 6, vx: (Math.random() - .5) * 4, life: 1.4, max: 1.4 }); }
    }
  }
  for (let i = sparkles.length - 1; i >= 0; i--) { const s = sparkles[i]; s.life += dt; s.x += dt * 2; if (s.life > s.max) sparkles.splice(i, 1); }
  for (let i = embers.length - 1; i >= 0; i--) { const e = embers[i]; e.x += e.vx * dt; e.y += e.vy * dt; e.life -= dt; if (e.life <= 0) embers.splice(i, 1); }
  for (const m of motes) { m.p += dt * .5; m.x += (6 + Math.sin(m.p) * 3) * dt * m.s; m.y += Math.cos(m.p * .7) * 2 * dt; if (m.x > WW) m.x -= WW; }
}

function drawBaker() {
  if (!atlas.naturalWidth) return;
  let sx, sy;
  if (baker.moving) { sy = (8 + baker.dir) * 80; sx = (Math.floor(baker.t * pace.walk) % 6) * 80; }
  else if (baker.dir === 0) { sy = 16 * 80; sx = 0; }
  else { sy = baker.dir * 80; sx = (Math.floor(baker.t * pace.idle) % 4) * 80; }
  const k = S.scale, size = 80 * k;
  ctx.fillStyle = 'rgba(5,6,14,.45)'; ctx.beginPath(); ctx.ellipse(baker.x, baker.y - 1, 15 * k, 4 * k, 0, 0, Math.PI * 2); ctx.fill();
  ctx.drawImage(atlas, sx, sy, 80, 80, Math.round(baker.x - size / 2), Math.round(baker.y - FOOT_Y * k), size, size);
}
// a standing character: breathes in place and turns to face the baker when he comes close
function drawNpc(n) {
  const c = CAST[n.who]; if (!c || !c.atlas.naturalWidth) return;
  const near = Math.hypot(baker.x - n.x, baker.y - n.y) < 150;
  const dir = near ? dirFrom(baker.x - n.x, baker.y - n.y) : n.dir;
  const sy = dir * 80, sx = (Math.floor(n.t * pace.idle) % 4) * 80, k = S.scale, size = 80 * k;
  if (!n.behind) { ctx.fillStyle = 'rgba(5,6,14,.45)'; ctx.beginPath(); ctx.ellipse(n.x, n.y - 1, 15 * k, 4 * k, 0, 0, Math.PI * 2); ctx.fill(); }
  ctx.drawImage(c.atlas, sx, sy, 80, 80, Math.round(n.x - size / 2), Math.round(n.y - c.footY * k), size, size);
}
function glow(x, y, r, a, rgb) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`);
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
}
function draw(time) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#05070b'; ctx.fillRect(0, 0, VW, VH);
  if (!S || !S.plate.naturalWidth) return;
  const ox = Math.round(cam.x), oy = Math.round(cam.y);
  ctx.setTransform(1, 0, 0, 1, -ox, -oy);
  ctx.drawImage(S.plate, 0, 0);
  if (fxOn) for (const s of sparkles) { const a = Math.sin(Math.PI * s.life / s.max); ctx.fillStyle = `rgba(150,190,235,${a * .55})`; ctx.fillRect(Math.round(s.x), s.y, s.len, 1); }

  // a soft pulse marks each door zone
  for (const e of S.exits) {
    const [a, b, c, d] = e.zone, cx = (a + c) / 2, cy = d - 6, pulse = 0.5 + 0.5 * Math.sin(time * 2.2);
    ctx.globalCompositeOperation = 'lighter'; glow(cx, cy, 16 + pulse * 4, 0.10 + pulse * 0.08, '255,210,120'); ctx.globalCompositeOperation = 'source-over';
  }

  const npcs = S.npcs || [];
  for (const n of npcs) if (n.behind) drawNpc(n);
  for (const f of (S.fronts || [])) if (f.img.naturalWidth) ctx.drawImage(f.img, f.x, f.y);
  const layer = [{ y: baker.y, d: drawBaker }, ...npcs.filter(n => !n.behind).map(n => ({ y: n.y, d: () => drawNpc(n) }))];
  layer.sort((a, b) => a.y - b.y).forEach(o => o.d());

  if (fxOn) {
    ctx.globalCompositeOperation = 'lighter';
    S.lights.forEach(([x, y, r, rgb, f], i) => {
      const fl = 1 - f * (0.12 + 0.1 * Math.sin(time * 7.3 + i * 2.1) + 0.08 * Math.sin(time * 13.1 + i * 5.7) + (Math.random() < .02 ? .25 : 0));
      glow(x, y, r * (0.92 + fl * 0.1), 0.16 * fl, rgb);
    });
    for (const e of embers) { const a = e.life / e.max; ctx.fillStyle = `rgba(255,200,110,${a})`; ctx.fillRect(Math.round(e.x), Math.round(e.y), 1, 1); }
    ctx.globalCompositeOperation = 'source-over';
    if (S.fx.mist) {
      ctx.imageSmoothingEnabled = true;
      const layer = (tex, scale, speed, alpha, yo) => {
        const sz = 128 * scale, off = (time * speed) % sz; ctx.globalAlpha = alpha;
        for (let y = -sz + yo; y < WH + sz; y += sz) for (let x = -sz - off; x < WW + sz; x += sz) ctx.drawImage(tex, x, y, sz, sz);
        ctx.globalAlpha = 1;
      };
      layer(mistA, 3, 5, 0.16, 20); layer(mistB, 2, 9, 0.10, 70);
      ctx.imageSmoothingEnabled = false;
    }
    for (const m of motes) { const a = 0.25 + 0.25 * Math.sin(m.p * 2); ctx.fillStyle = `rgba(${S.fx.mote},${a})`; ctx.fillRect(Math.round(m.x), Math.round(m.y), 1, 1); }
  }

  if (showPaths) {
    ctx.fillStyle = 'rgba(90,255,140,.22)'; ctx.strokeStyle = 'rgba(90,255,140,.8)';
    for (const p of S.walk) { ctx.beginPath(); p.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); ctx.fill(); ctx.stroke(); }
    ctx.fillStyle = 'rgba(255,80,80,.5)'; for (const [a, b, c, d] of S.block) ctx.fillRect(a, b, c - a, d - b);
    ctx.fillStyle = 'rgba(255,210,80,.45)'; for (const e of S.exits) { const [a, b, c, d] = e.zone; ctx.fillRect(a, b, c - a, d - b); }
  }
  if (marker) {
    const s = 3 - marker.t * 3, a = 1 - marker.t / 0.7; ctx.fillStyle = marker.ok ? `rgba(255,225,60,${a})` : `rgba(255,70,60,${a})`;
    for (let i = -s; i <= s; i++) { ctx.fillRect(Math.round(marker.x + i), Math.round(marker.y + i), 1, 1); ctx.fillRect(Math.round(marker.x + i), Math.round(marker.y - i), 1, 1); }
  }

  // vignette: clear around the baker, darker toward the screen edges
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const outer = Math.hypot(VW, VH) / 2, inner = outer * 0.5;
  const vx = Math.max(VW * .3, Math.min(VW * .7, baker.x - ox)), vy = Math.max(VH * .3, Math.min(VH * .7, baker.y - 35 * S.scale - oy));
  const v = ctx.createRadialGradient(vx, vy, inner, vx, vy, outer);
  v.addColorStop(0, 'rgba(0,0,10,0)'); v.addColorStop(1, 'rgba(0,0,10,.55)'); ctx.fillStyle = v; ctx.fillRect(0, 0, VW, VH);
  if (fade > 0) { ctx.fillStyle = `rgba(3,4,8,${fade})`; ctx.fillRect(0, 0, VW, VH); }
}

// read-only peek at the game state, used by automated checks
window.__game = { state: () => S && ({ scene: S.title, x: baker.x, y: baker.y, camX: cam.x, camY: cam.y, VW, VH, prompt: !promptEl.hidden, talk: talking ? talkLine.textContent : null, speed: baker.speed, fading: fadeDir !== 0 }) };

let last = performance.now(), started = false;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!started && SCENES.village.plate.naturalWidth) { started = true; enterScene('village'); }
  if (S) update(dt);
  draw(now / 1000);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
